<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>項目控管 v6.4.12 TEST</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f7fb;color:#25334a}.top{height:64px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;padding:0 24px}.title{font-weight:800;font-size:18px}.sub{font-size:13px;color:#94a3b8}.tabs{height:46px;background:#fff;border-bottom:1px solid #dbe3ef;padding:0 24px;display:flex;align-items:end}.tab{padding:11px 16px 10px;color:#64748b;font-weight:700;font-size:16px}.tab.active{color:#2563eb;border-bottom:3px solid #2563eb}.page{padding:14px 18px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.bar h2{font-size:22px;margin:0}.savehint{font-size:13px;color:#94a3b8}.actions{display:flex;gap:7px}.add,.reset{border:0;border-radius:7px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:16px}.add{background:#2563eb;color:#fff}.reset{background:#e8edf5;color:#475569}.wrap{overflow:auto;border:1px solid #cfd8e6;background:#fff}table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid #cfd8e6;border-bottom:1px solid #cfd8e6;padding:0;vertical-align:top;font-size:16px;text-align:left}th{height:42px;background:#eef2f7;position:sticky;top:0;z-index:4;font-weight:750;color:#334155;font-size:16px;position:sticky}th:last-child,td:last-child{border-right:0}.th{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;gap:4px;position:relative}.col-resize{position:absolute;right:-5px;top:0;width:10px;height:100%;cursor:col-resize;z-index:10}.col-resize:hover{background:#2563eb33}.fbtn{border:0;background:transparent;color:#94a3b8;cursor:pointer;padding:4px;font-size:14px}.cell{min-height:60px;padding:9px 10px;white-space:pre-wrap;line-height:1.55;outline:none}.cell:hover{background:#f8fbff}.cell:focus{background:#fff;border:2px solid #2563eb;padding:7px 8px}.clamp{position:relative;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-height:118px;cursor:text;padding-bottom:28px}.clamp.expanded{display:block;max-height:none;overflow:visible;padding-bottom:32px}.more{display:none;position:absolute;right:7px;bottom:4px;border:1px solid #cbd5e1;background:#fff;color:#2563eb;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:700;cursor:pointer;z-index:2}.clamp.truncated .more,.clamp.expanded .more{display:block}.date,.sel{width:100%;min-height:60px;border:0;background:transparent;padding:8px;font:inherit;font-size:16px;color:#334155}.date:focus,.sel:focus{outline:2px solid #2563eb;outline-offset:-2px;background:#fff}.case-start td{border-top:2px solid #94a3b8}.casecell{background:#fff}.deliverycell{background:#fbfdff}.due-soon{background:#fff8df!important}.due-over{background:#fff0f0!important}.done-row{opacity:.58}.done-row td.deliverycell{background:#f8fafc}.opbox{min-height:60px;display:flex;align-items:center;justify-content:center;gap:3px}.icon{border:0;background:transparent;cursor:pointer;color:#64748b;font-size:18px;padding:4px}.icon:hover{color:#2563eb}.del:hover{color:#dc2626}.case-resize{height:9px;cursor:row-resize;background:transparent;position:absolute;left:0;right:0;bottom:-5px;z-index:5}.case-resize:hover{background:#2563eb44}.resizable-case{position:relative}.filter{position:fixed;z-index:20;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px #0f172a22;padding:8px;min-width:190px;display:none;font-size:16px}.filter.show{display:block}.filter button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:9px;border-radius:5px;cursor:pointer;font-size:16px}.filter button:hover{background:#f1f5f9}.checks label{display:block;padding:7px}.empty{padding:30px!important;text-align:center;color:#94a3b8}.saving{color:#2563eb}body.resizing{user-select:none;cursor:col-resize}body.rowresizing{user-select:none;cursor:row-resize}@media(max-width:800px){.page{padding:10px}.savehint{display:none}}</style></head><body><div class="top"><div><div class="title">班級教學進度排程</div><div class="sub">Item Control Prototype · v6.4.12 TEST</div></div></div><div class="tabs"><div class="tab">體育課課表</div><div class="tab active">項目控管</div></div><div class="page"><div class="bar"><div><h2>項目控管</h2><span id="hint" class="savehint">拖曳表頭分隔線調欄寬 · 拖曳案件底線調高度</span></div><div class="actions"><button class="reset" id="reset">重設尺寸</button><button class="add" id="add">＋ 新增案件</button></div></div><div class="wrap"><table id="tbl"><colgroup id="cols"></colgroup><thead><tr><th><div class="th">收文時間 <button class="fbtn" data-filter="receive">↕</button><i class="col-resize" data-col="0"></i></div></th><th><div class="th">主旨<i class="col-resize" data-col="1"></i></div></th><th><div class="th">內容<i class="col-resize" data-col="2"></i></div></th><th><div class="th">待交付文件<i class="col-resize" data-col="3"></i></div></th><th><div class="th">備註<i class="col-resize" data-col="4"></i></div></th><th><div class="th">交付管道 <button class="fbtn" data-filter="channel">▼</button><i class="col-resize" data-col="5"></i></div></th><th><div class="th">交付時限 <button class="fbtn" data-filter="deadline">↕</button><i class="col-resize" data-col="6"></i></div></th><th><div class="th">狀態 <button class="fbtn" data-filter="status">▼</button><i class="col-resize" data-col="7"></i></div></th><th><div class="th">操作<i class="col-resize" data-col="8"></i></div></th></tr></thead><tbody id="body"></tbody></table></div></div><div id="filter" class="filter"></div><script>const K='tp.controlCases.v648',SK='tp.controlSizes.v6412',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),today=()=>new Date().toISOString().slice(0,10),DEF=[115,210,325,310,195,155,135,125,80];let cases=JSON.parse(localStorage.getItem(K)||'null')||[],sizes=JSON.parse(localStorage.getItem(SK)||'null')||{cols:[...DEF],rows:{}};let displayOrder=cases.map(c=>c.id),statusSet=new Set(['open','doing','done','overdue']),channelSet=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),over=d=>d.status!=='done'&&d.deadline&&d.deadline<today(),st=d=>over(d)?'overdue':d.status;function saveSizes(){localStorage.setItem(SK,JSON.stringify(sizes))}function makeCols(){$('cols').innerHTML=sizes.cols.map(w=>`<col style="width:${w}px">`).join('')}makeCols();let timer;function persist(){clearTimeout(timer);$('hint').textContent='儲存中…';$('hint').classList.add('saving');timer=setTimeout(()=>{localStorage.setItem(K,JSON.stringify(cases));$('hint').textContent='已自動儲存';$('hint').classList.remove('saving');setTimeout(()=>$('hint').textContent='拖曳表頭分隔線調欄寬 · 拖曳案件底線調高度',1000)},250)}function deadlineKey(c){let u=c.deliveries.filter(d=>d.status!=='done'&&d.deadline).map(d=>d.deadline).sort();return u[0]||c.deliveries.filter(d=>d.deadline).map(d=>d.deadline).sort()[0]||'9999-12-31'}function daysLeft(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)}function dueClass(d){if(d.status==='done')return '';let n=daysLeft(d.deadline);return n<0?'due-over':n<=3?'due-soon':''}function visible(c){let ss=c.deliveries.map(st);if(!ss.some(x=>statusSet.has(x)))return false;if(channelSet&&channelSet.size&&!c.deliveries.some(d=>channelSet.has(d.channel)))return false;return true}function ce(c,f,cl=''){return `<div class="cell ${cl}" contenteditable="true" data-c="${c.id}" data-field="${f}">${esc(c[f])}${cl?'<button class="more" contenteditable="false" type="button">展開 ▼</button>':''}</div>`}function ordered(){let map=new Map(cases.map(c=>[c.id,c]));let a=displayOrder.map(id=>map.get(id)).filter(Boolean);cases.forEach(c=>{if(!displayOrder.includes(c.id)){displayOrder.unshift(c.id);a.unshift(c)}});return a.filter(visible)}function render(){let a=ordered();$('body').innerHTML=a.length?a.map(c=>{let ds=c.deliveries.length?c.deliveries:[{id:uid(),channel:'',deadline:'',status:'open',completedAt:''}];if(!c.deliveries.length)c.deliveries=ds;let allDone=ds.every(d=>d.status==='done'),rh=sizes.rows[c.id]||0;return ds.map((d,i)=>`<tr data-case="${c.id}" class="${i===0?'case-start ':''}${allDone?'done-row':''}" ${rh?`style="height:${Math.max(60,rh/ds.length)}px"`:''}>${i?'':`<td rowspan="${ds.length}" class="casecell resizable-case"><input class="date" type="date" data-c="${c.id}" value="${c.receive||''}"><i class="case-resize" data-case="${c.id}"></i></td><td rowspan="${ds.length}" class="casecell">${ce(c,'subject')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'content','clamp')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'docs','clamp')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'note','clamp')}</td>`}<td class="deliverycell"><div class="cell" contenteditable="true" data-c="${c.id}" data-d="${d.id}" data-field="channel">${esc(d.channel)}</div></td><td class="deliverycell ${dueClass(d)}"><input class="date" type="date" data-c="${c.id}" data-d="${d.id}" data-field="deadline" value="${d.deadline||''}"></td><td class="deliverycell ${dueClass(d)}"><select class="sel" data-c="${c.id}" data-d="${d.id}" data-field="status"><option value="open" ${d.status==='open'?'selected':''}>${over(d)?'逾期（未完成）':'未完成'}</option><option value="doing" ${d.status==='doing'?'selected':''}>${over(d)?'逾期（辦理中）':'辦理中'}</option><option value="done" ${d.status==='done'?'selected':''}>已完成</option></select></td><td class="deliverycell"><div class="opbox"><button class="icon" onclick="addDelivery('${c.id}')">＋</button><button class="icon del" onclick="delDelivery('${c.id}','${d.id}')">×</button>${i===0?`<button class="icon del" onclick="delCase('${c.id}')">🗑</button>`:''}</div></td></tr>`).join('')}).join(''):'<tr><td colspan="9" class="empty">沒有符合目前篩選條件的案件</td></tr>';bind();requestAnimationFrame(markTruncated)}function findC(id){return cases.find(c=>c.id===id)}function cleanText(e){let x=e.cloneNode(true);x.querySelectorAll('.more').forEach(n=>n.remove());return x.innerText.trimEnd()}function markTruncated(){document.querySelectorAll('.clamp').forEach(e=>{let b=e.querySelector('.more');if(!e.classList.contains('expanded')){e.classList.remove('truncated');if(b)b.textContent='展開 ▼';if(e.scrollHeight>e.clientHeight+2)e.classList.add('truncated')}})}function bind(){document.querySelectorAll('[contenteditable]').forEach(e=>e.onblur=()=>{let c=findC(e.dataset.c),v=cleanText(e);if(e.dataset.d)c.deliveries.find(d=>d.id===e.dataset.d)[e.dataset.field]=v;else c[e.dataset.field]=v;persist()});document.querySelectorAll('.more').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();let cell=b.closest('.clamp'),open=cell.classList.toggle('expanded');cell.classList.add('truncated');b.textContent=open?'收合 ▲':'展開 ▼'});document.querySelectorAll('input.date,select.sel').forEach(e=>e.onchange=()=>{let c=findC(e.dataset.c);if(e.dataset.d){let d=c.deliveries.find(x=>x.id===e.dataset.d),old=d.status;d[e.dataset.field]=e.value;if(e.dataset.field==='status')d.completedAt=e.value==='done'?(old==='done'&&d.completedAt?d.completedAt:today()):''}else c.receive=e.value;persist();if(e.dataset.field==='status')render()});bindRowResize()}function bindRowResize(){document.querySelectorAll('.case-resize').forEach(h=>h.onmousedown=e=>{e.preventDefault();let id=h.dataset.case,rows=[...document.querySelectorAll(`tr[data-case="${id}"]`)],start=e.clientY,startH=rows.reduce((n,r)=>n+r.getBoundingClientRect().height,0);document.body.classList.add('rowresizing');function mv(ev){let total=Math.max(60*rows.length,startH+ev.clientY-start);rows.forEach(r=>r.style.height=(total/rows.length)+'px');sizes.rows[id]=total;requestAnimationFrame(markTruncated)}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.classList.remove('rowresizing');saveSizes()}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)})}document.querySelectorAll('.col-resize').forEach(h=>h.onmousedown=e=>{e.preventDefault();e.stopPropagation();let i=+h.dataset.col,start=e.clientX,startW=sizes.cols[i];document.body.classList.add('resizing');function mv(ev){sizes.cols[i]=Math.max(i===8?65:90,startW+ev.clientX-start);makeCols();requestAnimationFrame(markTruncated)}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.classList.remove('resizing');saveSizes()}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});window.addDelivery=id=>{findC(id).deliveries.push({id:uid(),channel:'',deadline:'',status:'open',completedAt:''});persist();render()};window.delDelivery=(cid,did)=>{let c=findC(cid);if(c.deliveries.length===1)c.deliveries[0]={id:c.deliveries[0].id,channel:'',deadline:'',status:'open',completedAt:''};else c.deliveries=c.deliveries.filter(d=>d.id!==did);persist();render()};window.delCase=id=>{if(confirm('確定刪除整個案件？')){cases=cases.filter(c=>c.id!==id);displayOrder=displayOrder.filter(x=>x!==id);delete sizes.rows[id];saveSizes();persist();render()}};$('add').onclick=()=>{let c={id:uid(),receive:today(),subject:'',content:'',docs:'',note:'',deliveries:[{id:uid(),channel:'',deadline:'',status:'open',completedAt:''}]};cases.unshift(c);displayOrder.unshift(c.id);persist();render()};$('reset').onclick=()=>{if(confirm('要把所有欄寬與案件高度恢復預設嗎？')){sizes={cols:[...DEF],rows:{}};saveSizes();makeCols();render()}};function applySort(field,dir){displayOrder=[...cases].sort((x,y)=>{let ax=field==='receive'?(x.receive||''):deadlineKey(x),ay=field==='receive'?(y.receive||''):deadlineKey(y);return dir==='asc'?ax.localeCompare(ay):ay.localeCompare(ax)}).map(c=>c.id);render()}const fp=$('filter');function popup(btn,type){let r=btn.getBoundingClientRect();fp.style.left=Math.min(r.left,innerWidth-200)+'px';fp.style.top=(r.bottom+4)+'px';if(type==='deadline'||type==='receive'){fp.innerHTML=`<button data-sort="asc">${type==='deadline'?'期限近 → 遠':'收文舊 → 新'}</button><button data-sort="desc">${type==='deadline'?'期限遠 → 近':'收文新 → 舊'}</button>`;fp.querySelectorAll('button').forEach(b=>b.onclick=()=>{applySort(type,b.dataset.sort);fp.classList.remove('show')})}else{let vals=type==='status'?[['open','未完成'],['doing','辦理中'],['overdue','逾期'],['done','已完成']]:[...new Set(cases.flatMap(c=>c.deliveries.map(d=>d.channel).filter(Boolean)))].map(x=>[x,x]);let set=type==='status'?statusSet:(channelSet||new Set(vals.map(v=>v[0])));fp.innerHTML='<div class="checks">'+vals.map(([v,t])=>`<label><input type="checkbox" value="${esc(v)}" ${set.has(v)?'checked':''}> ${esc(t)}</label>`).join('')+'</div><button id="apply">套用</button>';fp.querySelector('#apply').onclick=()=>{let n=new Set([...fp.querySelectorAll('input:checked')].map(x=>x.value));if(type==='status')statusSet=n;else channelSet=n;fp.classList.remove('show');render()}}fp.classList.add('show')}document.querySelectorAll('.fbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();popup(b,b.dataset.filter)});document.addEventListener('click',e=>{if(!fp.contains(e.target)&&!e.target.classList.contains('fbtn'))fp.classList.remove('show')});render();</script></body></html>
