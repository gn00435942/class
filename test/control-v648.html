<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>項目控管 v6.4.9 TEST</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f7fb;color:#25334a}.top{height:64px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;padding:0 24px}.title{font-weight:800}.sub{font-size:11px;color:#94a3b8}.tabs{height:44px;background:#fff;border-bottom:1px solid #dbe3ef;padding:0 24px;display:flex;align-items:end}.tab{padding:11px 16px 10px;color:#64748b;font-weight:700}.tab.active{color:#2563eb;border-bottom:3px solid #2563eb}.page{padding:14px 18px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.bar h2{font-size:18px;margin:0}.savehint{font-size:11px;color:#94a3b8}.add{border:0;background:#2563eb;color:#fff;border-radius:7px;padding:7px 11px;cursor:pointer;font-weight:700}.wrap{overflow:auto;border:1px solid #cfd8e6;background:#fff}table{width:100%;min-width:1320px;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid #cfd8e6;border-bottom:1px solid #cfd8e6;padding:0;vertical-align:top;font-size:12px;text-align:left}th{height:34px;background:#eef2f7;position:sticky;top:0;z-index:4;font-weight:700;color:#475569}th:last-child,td:last-child{border-right:0}.th{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;gap:4px}.fbtn{border:0;background:transparent;color:#94a3b8;cursor:pointer;padding:3px;font-size:10px}.receive{width:100px}.subject{width:190px}.detail{width:275px}.docs{width:260px}.note{width:190px}.channel{width:145px}.deadline{width:125px}.status{width:115px}.ops{width:70px}.cell{min-height:48px;padding:7px 8px;white-space:pre-wrap;line-height:1.45;outline:none}.cell:hover{background:#f8fbff}.cell:focus{background:#fff;border:2px solid #2563eb;padding:5px 6px}.date,.sel{width:100%;min-height:48px;border:0;background:transparent;padding:6px;font:inherit;color:#334155}.date:focus,.sel:focus{outline:2px solid #2563eb;outline-offset:-2px;background:#fff}.case-start td{border-top:2px solid #94a3b8}.casecell{background:#fff}.deliverycell{background:#fbfdff}.opbox{min-height:48px;display:flex;align-items:center;justify-content:center;gap:3px}.icon{border:0;background:transparent;cursor:pointer;color:#64748b;font-size:16px;padding:4px}.icon:hover{color:#2563eb}.del:hover{color:#dc2626}.filter{position:fixed;z-index:20;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px #0f172a22;padding:8px;min-width:170px;display:none}.filter.show{display:block}.filter button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:7px;border-radius:5px;cursor:pointer}.filter button:hover{background:#f1f5f9}.checks label{display:block;padding:5px}.empty{padding:30px!important;text-align:center;color:#94a3b8}.saving{color:#2563eb}@media(max-width:800px){.page{padding:10px}.savehint{display:none}}</style></head><body><div class="top"><div><div class="title">班級教學進度排程</div><div class="sub">Item Control Prototype · v6.4.9 TEST</div></div></div><div class="tabs"><div class="tab">體育課課表</div><div class="tab active">項目控管</div></div><div class="page"><div class="bar"><div><h2>項目控管</h2><span id="hint" class="savehint">直接修改資料不會重新排序 · 點欄位排序才重排</span></div><button class="add" id="add">＋ 新增案件</button></div><div class="wrap"><table><thead><tr><th class="receive"><div class="th">收文時間 <button class="fbtn" data-filter="receive">↕</button></div></th><th class="subject"><div class="th">主旨</div></th><th class="detail"><div class="th">內容</div></th><th class="docs"><div class="th">待交付文件</div></th><th class="note"><div class="th">備註</div></th><th class="channel"><div class="th">交付管道 <button class="fbtn" data-filter="channel">▼</button></div></th><th class="deadline"><div class="th">交付時限 <button class="fbtn" data-filter="deadline">↕</button></div></th><th class="status"><div class="th">狀態 <button class="fbtn" data-filter="status">▼</button></div></th><th class="ops"><div class="th">操作</div></th></tr></thead><tbody id="body"></tbody></table></div></div><div id="filter" class="filter"></div><script>const K='tp.controlCases.v648',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),today=()=>new Date().toISOString().slice(0,10);let cases=JSON.parse(localStorage.getItem(K)||'null')||[];let displayOrder=cases.map(c=>c.id),statusSet=new Set(['open','doing','done','overdue']),channelSet=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),over=d=>d.status!=='done'&&d.deadline&&d.deadline<today(),st=d=>over(d)?'overdue':d.status;let timer;function persist(){clearTimeout(timer);$('hint').textContent='儲存中…';$('hint').classList.add('saving');timer=setTimeout(()=>{localStorage.setItem(K,JSON.stringify(cases));$('hint').textContent='已自動儲存';$('hint').classList.remove('saving');setTimeout(()=>$('hint').textContent='直接修改資料不會重新排序 · 點欄位排序才重排',1000)},250)}function deadlineKey(c){let u=c.deliveries.filter(d=>d.status!=='done'&&d.deadline).map(d=>d.deadline).sort();return u[0]||c.deliveries.filter(d=>d.deadline).map(d=>d.deadline).sort()[0]||'9999-12-31'}function visible(c){let ss=c.deliveries.map(st);if(!ss.some(x=>statusSet.has(x)))return false;if(channelSet&&channelSet.size&&!c.deliveries.some(d=>channelSet.has(d.channel)))return false;return true}function ce(c,f){return `<div class="cell" contenteditable="true" data-c="${c.id}" data-field="${f}">${esc(c[f])}</div>`}function ordered(){let map=new Map(cases.map(c=>[c.id,c]));let a=displayOrder.map(id=>map.get(id)).filter(Boolean);cases.forEach(c=>{if(!displayOrder.includes(c.id)){displayOrder.unshift(c.id);a.unshift(c)}});return a.filter(visible)}function render(){let a=ordered();$('body').innerHTML=a.length?a.map(c=>{let ds=c.deliveries.length?c.deliveries:[{id:uid(),channel:'',deadline:'',status:'open',completedAt:''}];if(!c.deliveries.length)c.deliveries=ds;return ds.map((d,i)=>`<tr class="${i===0?'case-start':''}">${i?'':`<td rowspan="${ds.length}" class="casecell"><input class="date" type="date" data-c="${c.id}" value="${c.receive||''}"></td><td rowspan="${ds.length}" class="casecell">${ce(c,'subject')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'content')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'docs')}</td><td rowspan="${ds.length}" class="casecell">${ce(c,'note')}</td>`}<td class="deliverycell"><div class="cell" contenteditable="true" data-c="${c.id}" data-d="${d.id}" data-field="channel">${esc(d.channel)}</div></td><td class="deliverycell"><input class="date" type="date" data-c="${c.id}" data-d="${d.id}" data-field="deadline" value="${d.deadline||''}"></td><td class="deliverycell"><select class="sel" data-c="${c.id}" data-d="${d.id}" data-field="status"><option value="open" ${d.status==='open'?'selected':''}>${over(d)?'逾期（未完成）':'未完成'}</option><option value="doing" ${d.status==='doing'?'selected':''}>${over(d)?'逾期（辦理中）':'辦理中'}</option><option value="done" ${d.status==='done'?'selected':''}>已完成</option></select></td><td class="deliverycell"><div class="opbox"><button class="icon" title="新增交付管道" onclick="addDelivery('${c.id}')">＋</button><button class="icon del" title="刪除此交付管道" onclick="delDelivery('${c.id}','${d.id}')">×</button>${i===0?`<button class="icon del" title="刪除整個案件" onclick="delCase('${c.id}')">🗑</button>`:''}</div></td></tr>`).join('')}).join(''):'<tr><td colspan="9" class="empty">沒有符合目前篩選條件的案件</td></tr>';bind()}function findC(id){return cases.find(c=>c.id===id)}function bind(){document.querySelectorAll('[contenteditable]').forEach(e=>e.onblur=()=>{let c=findC(e.dataset.c),v=e.innerText.trimEnd();if(e.dataset.d)c.deliveries.find(d=>d.id===e.dataset.d)[e.dataset.field]=v;else c[e.dataset.field]=v;persist()});document.querySelectorAll('input.date,select.sel').forEach(e=>e.onchange=()=>{let c=findC(e.dataset.c);if(e.dataset.d){let d=c.deliveries.find(x=>x.id===e.dataset.d),old=d.status;d[e.dataset.field]=e.value;if(e.dataset.field==='status')d.completedAt=e.value==='done'?(old==='done'&&d.completedAt?d.completedAt:today()):''}else c.receive=e.value;persist()})}window.addDelivery=id=>{findC(id).deliveries.push({id:uid(),channel:'',deadline:'',status:'open',completedAt:''});persist();render()};window.delDelivery=(cid,did)=>{let c=findC(cid);if(c.deliveries.length===1)c.deliveries[0]={id:c.deliveries[0].id,channel:'',deadline:'',status:'open',completedAt:''};else c.deliveries=c.deliveries.filter(d=>d.id!==did);persist();render()};window.delCase=id=>{if(confirm('確定刪除整個案件？')){cases=cases.filter(c=>c.id!==id);displayOrder=displayOrder.filter(x=>x!==id);persist();render()}};$('add').onclick=()=>{let c={id:uid(),receive:today(),subject:'',content:'',docs:'',note:'',deliveries:[{id:uid(),channel:'',deadline:'',status:'open',completedAt:''}]};cases.unshift(c);displayOrder.unshift(c.id);persist();render()};function applySort(field,dir){let a=[...cases].sort((x,y)=>{let ax=field==='receive'?(x.receive||''):deadlineKey(x),ay=field==='receive'?(y.receive||''):deadlineKey(y);return dir==='asc'?ax.localeCompare(ay):ay.localeCompare(ax)});displayOrder=a.map(c=>c.id);render()}const fp=$('filter');function popup(btn,type){let r=btn.getBoundingClientRect();fp.style.left=Math.min(r.left,innerWidth-190)+'px';fp.style.top=(r.bottom+4)+'px';if(type==='deadline'||type==='receive'){fp.innerHTML=`<button data-sort="asc">${type==='deadline'?'期限近 → 遠':'收文舊 → 新'}</button><button data-sort="desc">${type==='deadline'?'期限遠 → 近':'收文新 → 舊'}</button>`;fp.querySelectorAll('button').forEach(b=>b.onclick=()=>{applySort(type,b.dataset.sort);fp.classList.remove('show')})}else{let vals=type==='status'?[['open','未完成'],['doing','辦理中'],['overdue','逾期'],['done','已完成']]:[...new Set(cases.flatMap(c=>c.deliveries.map(d=>d.channel).filter(Boolean)))].map(x=>[x,x]);let set=type==='status'?statusSet:(channelSet||new Set(vals.map(v=>v[0])));fp.innerHTML='<div class="checks">'+vals.map(([v,t])=>`<label><input type="checkbox" value="${esc(v)}" ${set.has(v)?'checked':''}> ${esc(t)}</label>`).join('')+'</div><button id="apply">套用</button>';fp.querySelector('#apply').onclick=()=>{let n=new Set([...fp.querySelectorAll('input:checked')].map(x=>x.value));if(type==='status')statusSet=n;else channelSet=n;fp.classList.remove('show');render()}}fp.classList.add('show')}document.querySelectorAll('.fbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();popup(b,b.dataset.filter)});document.addEventListener('click',e=>{if(!fp.contains(e.target)&&!e.target.classList.contains('fbtn'))fp.classList.remove('show')});render();</script></body></html>
