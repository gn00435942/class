id=>{if(draftDs.length===1){draftDs[0].channel='';draftDs[0].deadline=''}else draftDs=draftDs.filter(d=>d.id!==id);renderDraftDs()};$('aiAdd').onclick=openAI;$('aiX').onclick=closeAI;$('aiCancel').onclick=closeAI;$('draftPlus').onclick=()=>{draftDs.push({id:uid(),channel:'',deadline:''});renderDraftDs()};$('simulate').onclick=()=>{$('drReceive').value=today();$('drSubject').value='115學年度運動代表隊補助申請（模擬）';$('drContent').value='依公文規定彙整申請資料，完成校內核章後依指定方式送件。';$('drDocs').value='1. 申請表【線上、紙本】\n2. 自我檢核表【線上、紙本】\n3. Excel名冊【線上】\n4. 核章正本【紙本】';$('drNote').value='AI判讀草稿：請確認各管道期限與應繳資料。';let base=new Date();let d1=new Date(base);d1.setDate(base.getDate()+7);let d2=new Date(base);d2.setDate(base.getDate()+10);let fmt=d=>d.toISOString().slice(0,10);draftDs=[{id:uid(),channel:'線上系統',deadline:fmt(d1)},{id:uid(),channel:'紙本送件',deadline:fmt(d2)}];renderDraftDs()};$('aiConfirm').onclick=()=>{let c={id:uid(),receive:$('drReceive').value||today(),subject:$('drSubject').value.trim(),content:$('drContent').value.trim(),docs:$('drDocs').value.trim(),note:$('drNote').value.trim(),deliveries:draftDs.map(d=>({id:uid(),channel:d.channel.trim(),deadline:d.deadline,status:'open',completedAt:''}))};cases.unshift(c);displayOrder.unshift(c.id);persist();render();closeAI()};$('aiModal').onclick=e=>{if(e.target===$('aiModal'))closeAI()};render();</script></body></html>
