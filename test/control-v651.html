adding:12px;margin:8px 0}.doc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.version-row{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px 10px;margin-top:6px;border-radius:6px;font-size:12px}.case-empty{height:100%;display:grid;place-items:center;text-align:center;color:#94a3b8}.case-login-note{padding:30px;text-align:center}.case-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.case-import-summary{border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;font-size:13px}.case-warning{background:#fff7ed;color:#9a3412;border-radius:8px;padding:10px;margin-top:10px;font-size:12px}.case-ok{background:#ecfdf5;color:#047857;border-radius:8px;padding:10px;margin-top:10px;font-size:12px}.case-btnrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.case-btnrow button,.case-btnrow label{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12px}.case-btnrow .primary{background:var(--blue);color:#fff;border-color:var(--blue)}@media(max-width:850px){.case-side{width:240px}.case-row{grid-template-columns:1fr}.case-form-grid{grid-template-columns:1fr}}

<body>
<header class="topbar"><div class="brand"><div class="logo">▦</div><div><div class="title">班級教學進度排程</div><div class="subtitle">Class Teaching Progress Scheduler · Cloud v6.5.1 TEST</div></div></div><div style="display:flex;align-items:center"><div class="toggle"><button id="weekBtn">週檢視</button><button id="monthBtn" class="active">月檢視</button></div><div class="authbox"><span id="authStatus" class="authstatus">未登入</span><button id="loginBtn" class="authbtn primary">登入</button><button id="logoutBtn" class="authbtn" style="display:none">登出</button></div></div></header>

<section id="teachingPage" class="workspace-page active"><div class="app"><aside class="side"><h3>班級管理</h3><div class="addrow"><input id="classInput" name="className" autocomplete="off" readonly placeholder="例如 604"><button id="addClassBtn">新增</button></div><div id="classList"></div><div class="importbox"><h4>Google 日曆匯入</h4><p>可匯入 Google Calendar 匯出的 .ics 檔。支援一次選擇多個行事曆檔案，登入後會同步保存到 Supabase 雲端，其他電腦登入也能看到。</p><input id="icsInput" type="file" accept=".ics,text/calendar" multiple hidden><button id="importIcsBtn" class="importbtn">匯入 .ics 行事曆</button><button id="clearImportedBtn" class="clearbtn">清除已匯入行事曆</button><div id="importStatus" class="importstatus"></div></div></aside><main class="main"><div class="nav"><div class="navleft"><button id="prevBtn">‹</button><div id="periodLabel" class="monthlabel"></div><button id="nextBtn">›</button><button id="todayBtn">今天</button></div><div id="viewHint" class="hint">整月進度總覽</div></div><div id="schedule" class="content month"></div></main></div>

</section>
<section id="controlPage" class="workspace-page"><iframe id="controlFrame" title="項目控管" src="./control-v6417-embed.html" style="width:100%;height:100%;border:0;background:#f4f7fb"></iframe></section>

<div id="loginModal" class="modalback"><div class="modal loginpanel"><h3>管理員登入</h3><div class="meta">登入後班級、教學進度與行事曆會與 Supabase 雲端同步。</div><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="密碼"><div id="loginError" class="cloudnote"></div><div class="actions"><button onclick="closeLogin()">取消</button><button id="doLoginBtn" class="primary">登入</button></div></div></div>
<div id="progressModal" class="modalback"><div class="modal"><h3>教學進度</h3><div id="progressMeta" class="meta"></div><textarea id="progressInput" placeholder="例如：籃球運球練習、體適能①&#10;按 Enter 可直接換行"></textarea><div class="actions"><button id="deleteProgress" class="danger">刪除</button><button onclick="closeProgress()">取消</button><button id="saveProgress" class="primary">儲存</button></div></div></div>
<div id="eventModal" class="modalback"><div class="modal"><h3>行事曆事件</h3><div id="eventMeta" class="meta"></div><div id="eventList"></div><input id="eventInput" placeholder="例如：教師會議、校慶"><div class="actions"><button onclick="closeEvent()">取消</button><button id="addEvent" class="primary">新增事件</button></div></div></div>

<div id="caseModal" class="modalback"><div class="modal" style="width:min(650px,100%)"><h3 id="caseModalTitle">新增案件</h3><div class="case-form-grid"><div><label>收文日期</label><input id="caseReceiveDate" type="date"></div><div><label>文號</label><input id="caseExternalKey"></div></div><label>主旨</label><input id="caseSubject"><label>內容</label><textarea id="caseContent"></textarea><label>備註</label><textarea id="caseNote" style="min-height:70px"></textarea><label>狀態</label><select id="caseStatus"><option value="open">待處理</option><option value="doing">處理中</option><option value="done">已完成</option></select><div class="actions"><button onclick="closeCaseModal()">取消</button><button id="caseSaveBtn" class="primary">儲存</button></div></div></div>
<div id="caseImportModal" class="modalback"><div class="modal" style="width:min(700px,100%)"><h3>匯入案件 ZIP</h3><div class="meta">不需要解壓縮；確認前不會寫入案件。</div><input id="caseZipInput" type="file" accept=".zip,application/zip"><div id="caseImportResult"></div><div class="actions"><button onclick="closeCaseImport()">取消</button><button id="caseCommitBtn" class="primary" disabled>確認並一次匯入</button></div></div></div>

<script>
const SUPABASE_URL='https://tiirqeoptszgnexzpigw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_bVKOO37mrGJDKW3tEMxKOQ_s7nOfITn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null;
const K={classes:'tp.classes',entries:'tp.entries',events:'tp.events'};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const load=(k,d)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
let classes=load(K.classes,[{id:'c1',name:'601'},{id:'c2',name:'602'},{id:'c3',name:'603'}]);
let entries=load(K.entries,[]), events=load(K.events,[]);
if(!localStorage.getItem(K.events)){events=[['2026-09-01','開學日'],['2026-09-10','教師會議'],['2026-09-15','校慶'],['2026-09-20','放假'],['2026-09-25','游泳課']].map(x=>({id:uid(),date:x[0],title:x[1],source:'sample'}));}
let mode='month', anchor=new Date(2026,8,1), editing=null,eventDate=null;
const save=()=>{localStorage.setItem(K.classes,JSON.stringify(classes));localStorage.setItem(K.entries,JSON.stringify(entries));localStorage.setItem(K.events,JSON.stringify(events));};
const pad=n=>String(n).padStart(2,'0'); const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; const wd=['日','一','二','三','四','五','六'];
const sameDay=(a,b)=>a.toDateString()===b.toDateString(); const today=new Date();
function calendarCutoff(){return `${new Date().getFullYear()-1}-01-01`}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function firstLine(s=''){return String(s).split(/\r?\n/)[0]}
function tooltipText(s=''){return String(s).replace(/\r?\n/g,' ↵ ')}
function monthWeeks(y,m){let first=new Date(y,m,1), last=new Date(y,m+1,0), start=new Date(first);start.setDate(first.getDate()-first.getDay());let end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));let out=[];for(let d=new Date(start);d<=end;){let w=[];for(let i=0;i<7;i++){w.push(new Date(d));d.setDate(d.getDate()+1)}out.push(w)}return out}
function weekDays(d){let s=new Date(d);s.setDate(d.getDate()-d.getDay());return Array.from({length:7},(_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return x})}
function renderClasses(){let box=document.getElementById('classList');box.innerHTML=classes.map(c=>`<div class="classitem"><span>${esc(c.name)}</span><button title="刪除" onclick="removeClass('${c.id}')">🗑</button></div>`).join('')||'<div class="empty">尚無班級</div>'}
async function addClass(){let input=document.getElementById('classInput');let name=input.value.trim();if(!name)return;if(classes.some(c=>c.name===name)){toast('這個班級已存在');return}if(!currentUser){toast('請先登入才能新增班級');openLogin();return}let {data,error}=await sb.from('classes').insert({name}).select().single();if(error){console.error(error);toast('雲端新增失敗');return}classes.push({id:'db-'+data.id,name:data.name,dbId:data.id});input.value='';save();render();toast('已新增 '+name)}
async function removeClass(id){let c=classes.find(x=>x.id===id);if(!c)return;if(!currentUser){toast('請先登入才能刪除班級');openLogin();return}if(!confirm(`確定刪除 ${c.name}？這台電腦中該班教學進度也會刪除。`))return;let q=sb.from('classes').delete();q=c.dbId?q.eq('id',c.dbId):q.eq('name',c.name);let {error}=await q;if(error){console.error(error);toast('雲端刪除失敗');return}classes=classes.filter(x=>x.id!==id);entries=entries.filter(x=>x.classId!==id);save();render();toast('已刪除 '+c.name)}
function setMode(m){mode=m;document.getElementById('weekBtn').classList.toggle('active',m==='week');document.getElementById('monthBtn').classList.toggle('active',m==='month');document.getElementById('viewHint').textContent=m==='month'?'整月進度總覽':'單週放大檢視';renderSchedule()}
function changePeriod(n){if(mode==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);else{anchor=new Date(anchor);anchor.setDate(anchor.getDate()+7*n)}renderSchedule()}
function renderSchedule(){let lab=document.getElementById('periodLabel');lab.textContent=`${anchor.getFullYear()}年${anchor.getMonth()+1}月`;let el=document.getElementById('schedule');el.className='content '+mode;if(mode==='month')renderMonth(el);else renderWeek(el)}

function renderMonth(el){let weeks=monthWeeks(anchor.getFullYear(),anchor.getMonth());el.innerHTML=weeks.map((week,wi)=>{let ds=week.map(d=>{let muted=d.getMonth()!==anchor.getMonth()?' muted':'';let weekend=(d.getDay()==0||d.getDay()==6)?' weekend':'';return `<th class="datehead${muted}${weekend}">${d.getMonth()+1}/${d.getDate()}<div class="wd">星期${wd[d.getDay()]}</div></th>`}).join('');let ev=week.map(d=>`<td class="eventcell" onclick="openEvent('${key(d)}')">${eventHTML(d)}</td>`).join('');let rows=classes.map(c=>`<tr><td class="classname">${esc(c.name)}</td>${week.map(d=>{let e=entries.find(x=>x.classId===c.id&&x.date===key(d));let mut=d.getMonth()!==anchor.getMonth()?' muted':'';let weekend=(d.getDay()==0||d.getDay()==6)?' weekend':'';return `<td class="progresscell${mut}${weekend}" onclick="openProgress('${c.id}','${key(d)}')" title="${e?esc(tooltipText(e.content)):''}">${e?`<span class="progresschip">${esc(firstLine(e.content))}</span>`:''}</td>`}).join('')}</tr>`).join('');return `<div class="weekcard"><div class="weektitle">第 ${wi+1} 週　${week[0].getMonth()+1}/${week[0].getDate()} ～ ${week[6].getMonth()+1}/${week[6].getDate()}</div><table><thead><tr><th class="datehead">班級</th>${ds}</tr><tr><th class="calendar-label">行事曆</th>${ev}</tr></thead><tbody>${rows||`<tr><td colspan="8" class="empty">請先在左側新增班級</td></tr>`}</tbody></table></div>`}).join('')}

function unfoldICS(text){return text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/)}
function icsUnescape(s=''){return s.replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\')}
function parseIcsDate(raw){if(!raw)return null;let v=raw.trim();let m=v.match(/^(\d{4})(\d{2})(\d{2})/);if(!m)return null;return `${m[1]}-${m[2]}-${m[3]}`}
function addDaysKey(dateKey,n){let [y,m,d]=dateKey.split('-').map(Number);let x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return key(x)}
function expandRRule(startKey,rrule,limitEnd){if(!rrule)return [startKey];let parts=Object.fromEntries(rrule.split(';').map(p=>{let i=p.indexOf('=');return [p.slice(0,i),p.slice(i+1)]}));let freq=parts.FREQ, interval=Number(parts.INTERVAL||1), count=Number(parts.COUNT||0), until=parseIcsDate(parts.UNTIL||'');let maxEnd=until||limitEnd;let out=[startKey], [y,m,d]=startKey.split('-').map(Number);let cur=new Date(y,m-1,d), guard=0;while(guard++<1500){if(count&&out.length>=count)break;if(freq==='DAILY')cur.setDate(cur.getDate()+interval);else if(freq==='WEEKLY')cur.setDate(cur.getDate()+7*interval);else if(freq==='MONTHLY')cur.setMonth(cur.getMonth()+interval);else if(freq==='YEARLY')cur.setFullYear(cur.getFullYear()+interval);else break;let k=key(cur);if(maxEnd&&k>maxEnd)break;if(!maxEnd&&out.length>=260)break;out.push(k)}return out}
function parseICS(text,fileName){let lines=unfoldICS(text), result=[], ev=null;for(let line of lines){if(line==='BEGIN:VEVENT'){ev={};continue}if(line==='END:VEVENT'){if(ev&&ev.dtstart&&ev.summary){let start=parseIcsDate(ev.dtstart);if(start){let dates=expandRRule(start,ev.rrule,'2035-12-31');for(let date of dates)result.push({id:uid(),date,title:icsUnescape(ev.summary),source:'ics',calendar:fileName,icsUid:ev.uid||'',importedAt:Date.now()})}}ev=null;continue}if(!ev)continue;let idx=line.indexOf(':');if(idx<0)continue;let left=line.slice(0,idx), val=line.slice(idx+1);let prop=left.split(';')[0].toUpperCase();if(prop==='DTSTART')ev.dtstart=val;else if(prop==='SUMMARY')ev.summary=val;else if(prop==='RRULE')ev.rrule=val;else if(prop==='UID')ev.uid=val}return result}
async function importICSFiles(files){if(!currentUser){toast('請先登入才能匯入並同步行事曆');openLogin();return}let all=[];for(let f of files){try{let text=await f.text();all.push(...parseICS(text,f.name))}catch(e){console.error(e)}}if(!all.length){toast('沒有讀到可匯入的事件');return}const cutoff=calendarCutoff();all=all.filter(e=>e.date>=cutoff);if(!all.length){document.getElementById('importStatus').textContent=`沒有符合範圍的事件（只保留 ${cutoff} 之後）`;toast('沒有符合保留範圍的事件');return}let {data:cloud,error:cloudError}=await sb.from('calendar_events').select('event_date,title,source').gte('event_date',cutoff);if(cloudError){console.error(cloudError);toast('讀取雲端行事曆失敗');return}let existing=new Set((cloud||[]).map(e=>`${e.event_date}|${e.title}|${e.source||'ics'}`));let rows=[];for(let e of all){let sig=`${e.date}|${e.title}|ics`;if(!existing.has(sig)){rows.push({event_date:e.date,title:e.title,source:'ics'});existing.add(sig)}}if(!rows.length){document.getElementById('importStatus').textContent=`沒有新增事件（符合範圍 ${all.length} 筆，皆已存在）`;toast('沒有新的行事曆事件');await syncCalendarFromCloud();return}let {data,error}=await sb.from('calendar_events').insert(rows).select('id,event_date,title,source');if(error){console.error(error);toast('行事曆上傳雲端失敗');return}await syncCalendarFromCloud();document.getElementById('importStatus').textContent=`已新增 ${data.length} 筆事件；只保留 ${cutoff} 之後資料`;toast(`已同步 ${data.length} 筆行事曆事件到雲端`)}
async function clearImported(){let n=events.filter(e=>e.source==='ics').length;if(!n){toast('目前沒有匯入的行事曆');return}if(!confirm(`確定清除 ${n} 筆由 .ics 匯入的事件？手動新增的事件會保留。`))return;if(!currentUser){toast('請先登入才能清除雲端行事曆');openLogin();return}let {error}=await sb.from('calendar_events').delete().eq('source','ics');if(error){console.error(error);toast('清除雲端行事曆失敗');return}events=events.filter(e=>e.source!=='ics');save();renderSchedule();document.getElementById('importStatus').textContent='已清除雲端匯入的行事曆事件';toast('已清除雲端匯入事件')}

async function syncProgressFromCloud(){
if(!currentUser)return;
let {data,error}=await sb.from('progress_entries').select('id,class_id,date,title').order('date');
if(error){console.error(error);toast('讀取雲端教學進度失敗');return}
if(!data.length&&entries.length){
  let rows=[];
  for(let e of entries){
    let c=classes.find(x=>x.id===e.classId);
    if(c?.dbId&&e.date&&e.content)rows.push({class_id:c.dbId,date:e.date,title:e.content});
  }
  if(rows.length){
    let seeded=await sb.from('progress_entries').insert(rows);
    if(seeded.error){console.error(seeded.error);toast('初次上傳教學進度失敗');return}
    let r=await sb.from('progress_entries').select('id,class_id,date,title').order('date');
    if(r.error){console.error(r.error);return}
    data=r.data;
  }
}
let localByDbClass=new Map(classes.filter(c=>c.dbId).map(c=>[String(c.dbId),c]));
entries=data.map(row=>{
  let c=localByDbClass.get(String(row.class_id));
  return {id:'dbp-'+row.id,dbId:row.id,classId:c?.id||('db-'+row.class_id),date:row.date,content:row.title};
}).filter(e=>classes.some(c=>c.id===e.classId));
save();render();
}
async function fetchCalendarEventsFromCutoff(){
  const pageSize=1000, cutoff=calendarCutoff();let from=0;let all=[];
  while(true){
    let {data,error}=await sb.from('calendar_events')
      .select('id,event_date,title,source')
      .gte('event_date',cutoff)
      .order('event_date',{ascending:true})
      .order('id',{ascending:true})
      .range(from,from+pageSize-1);
    if(error)return {data:null,error};
    all.push(...(data||[]));
    if(!data||data.length<pageSize)break;
    from+=pageSize;
  }
  return {data:all,error:null};
}
async function syncCalendarFromCloud(){
if(!currentUser)return;
let {data,error}=await fetchCalendarEventsFromCutoff();
if(error){console.error(error);toast('讀取雲端行事曆失敗');return}
if(!data.length){
  let localRows=[];let seen=new Set();
  for(let e of events){
    if(e.source==='sample'||!e.date||!e.title||e.date<calendarCutoff())continue;
    let sig=`${e.date}|${e.title}`;if(seen.has(sig))continue;seen.add(sig);
    localRows.push({event_date:e.date,title:e.title,source:e.source==='ics'?'ics':'manual'});
  }
  if(localRows.length){
    let seeded=await sb.from('calendar_events').insert(localRows);
    if(seeded.error){console.error(seeded.error);toast('初次上傳行事曆失敗');return}
    let r=await fetchCalendarEventsFromCutoff();
    if(r.error){console.error(r.error);toast('重新讀取雲端行事曆失敗');return}
    data=r.data;
  }
}
events=data.map(row=>({id:'dbe-'+row.id,dbId:row.id,date:row.event_date,title:row.title,source:row.source||'manual'}));
save();renderSchedule();
document.getElementById('importStatus').textContent=`雲端行事曆已同步：${calendarCutoff()} 之後，共 ${events.length} 筆事件`;
}

 if(r.error){console.error(r.error);toast('讀取案件失敗');return}
 caseItems=r.data||[];let ids=caseItems.map(x=>x.id),ds=[],docs=[],vers=[];
 if(ids.length){let [a,b]=await Promise.all([sb.from('deliveries').select('*').in('case_id',ids).order('sort_order'),sb.from('case_documents').select('*').in('case_id',ids).order('sort_order')]);if(a.error||b.error){toast('讀取案件內容失敗');return}ds=a.data||[];docs=b.data||[];let dids=docs.map(x=>x.id);if(dids.length){let v=await sb.from('document_versions').select('*').in('document_id',dids).order('version_number');if(v.error){toast('讀取文件版本失敗');return}vers=v.data||[]}}

 let deliveries=x.deliveries.map(d=>'<div class="case-row"><div><strong>'+esc(d.channel)+'</strong><br><small>'+esc(d.detail||'無補充說明')+'</small></div><div>'+esc(d.deadline||'未填期限')+'</div><div>'+deliveryStatusLabel[d.status]+'</div></div>').join('')||'<div class="control-placeholder">尚未設定繳交管道</div>';
 let documents=x.documents.map(d=>'<div class="doc-card"><div class="doc-top"><div><strong>'+esc(d.name)+'</strong><div class="case-meta">'+esc(d.format.toUpperCase())+' · '+documentStatusLabel[d.status]+'</div></div><div class="case-btnrow"><label>上傳版本<input type="file" hidden onchange="uploadCaseVersion(\''+x.id+'\',\''+d.id+'\',this)"></label></div></div>'+d.versions.slice().reverse().map(v=>'<div class="version-row"><span>'+esc(v.file_name)+' · v'+v.version_number+(v.is_current?' · 目前版本':'')+'</span><button class="case-action" onclick="downloadCaseFile(\''+esc(v.storage_path)+'\')">下載</button></div>').join('')+'</div>').join('')||'<div class="control-placeholder">尚未建立繳交文件</div>';
 main.innerHTML='<div class="case-detail"><div class="case-titlebar"><div><span class="case-tag">'+caseStatusLabel[x.status]+'</span><h2>'+esc(x.subject)+'</h2><div class="case-meta">收文：'+esc(x.receive_date||'未填')+' · 文號：'+esc(x.external_key||'未填')+'</div></div><div class="case-btnrow"><button class="primary" onclick="openCaseModal(\''+x.id+'\')">編輯案件</button><button onclick="archiveCaseItem(\''+x.id+'\')">封存</button></div></div><div class="case-section"><h3>內容</h3><div class="case-text">'+esc(x.content||'尚未填寫')+'</div></div><div class="case-section"><h3>繳交管道與日期</h3>'+deliveries+'</div><div class="case-section"><h3>繳交文件與成品</h3>'+documents+'</div>'+(x.note?'<div class="case-warning">'+esc(x.note)+'</div>':'')+'</div>'
}
function openCaseModal(id){
 if(!needCaseLogin())return;editingCaseId=id||null;let x=caseItems.find(v=>v.id===id);
 document.getElementById('caseModalTitle').textContent=x?'編輯案件':'新增案件';document.getElementById('caseReceiveDate').value=x?.receive_date||'';document.getElementById('caseExternalKey').value=x?.external_key||'';document.getElementById('caseSubject').value=x?.subject||'';document.getElementById('caseContent').value=x?.content||'';document.getElementById('caseNote').value=x?.note||'';document.getElementById('caseStatus').value=x?.status||'open';document.getElementById('caseModal').classList.add('show')
}
function closeCaseModal(){document.getElementById('caseModal').classList.remove('show');editingCaseId=null}
async function saveCaseItem(){
 let payload={receive_date:document.getElementById('caseReceiveDate').value||null,external_key:document.getElementById('caseExternalKey').value.trim()||null,subject:document.getElementById('caseSubject').value.trim(),content:document.getElementById('caseContent').value,note:document.getElementById('caseNote').value,status:document.getElementById('caseStatus').value};
 if(!payload.subject){toast('主旨不可空白');return}let r=editingCaseId?await sb.from('cases').update(payload).eq('id',editingCaseId):await sb.from('cases').insert(payload);if(r.error){console.error(r.error);toast('案件儲存失敗：'+r.error.message);return}closeCaseModal();await loadCases();toast('案件已儲存')
}
async function archiveCaseItem(id){if(!confirm('確定封存這個案件？'))return;let r=await sb.from('cases').update({status:'archived',deleted_at:new Date().toISOString()}).eq('id',id);if(r.error){toast('封存失敗');return}selectedCaseId=null;await loadCases();toast('案件已封存')}
async function uploadCaseVersion(caseId,documentId,input){
 let file=input.files[0];input.value='';if(!file)return;let role=prompt('檔案用途：template 範本、draft 草稿、final 正式檔','template');if(!['template','draft','final'].includes(role))return toast('檔案用途不正確');
 let last=await sb.from('document_versions').select('version_number').eq('document_id',documentId).order('version_number',{ascending:false}).limit(1).maybeSingle();let n=(last.data?.version_number||0)+1,path=currentUser.id+'/'+caseId+'/'+documentId+'/'+crypto.randomUUID()+'-'+file.name.replace(/[\\\\/:*?"<>|]/g,'_'),hash=await sha256Bytes(new Uint8Array(await file.arrayBuffer()));
 let up=await sb.storage.from('case-files').upload(path,file,{contentType:file.type||'application/octet-stream'});if(up.error)return toast('上傳失敗：'+up.error.message);await sb.from('document_versions').update({is_current:false}).eq('document_id',documentId).eq('role',role);let r=await sb.from('document_versions').insert({document_id:documentId,role,source_type:'user_upload',version_number:n,version_label:file.name,file_name:file.name,storage_path:path,media_type:file.type||'application/octet-stream',byte_size:file.size,sha256:hash,is_current:true});if(r.error)return toast('版本建立失敗');await loadCases();toast('檔案已上傳')
}
async function downloadCaseFile(path){let r=await sb.storage.from('case-files').createSignedUrl(path,120);if(r.error)return toast('下載連結建立失敗');window.open(r.data.signedUrl,'_blank','noopener')}
function closeCaseImport(){document.getElementById('caseImportModal').classList.remove('show');casePreview=null;document.getElementById('caseZipInput').value='';document.getElementById('caseImportResult').innerHTML='';document.getElementById('caseCommitBtn').disabled=true}
async function sha256Bytes(bytes){let h=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function inflateRaw(bytes){let s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
function zu16(v,o){return v.getUint16(o,true)}function zu32(v,o){return v.getUint32(o,true)}
async function readCaseZip(file){
 if(file.size>50*1024*1024)throw Error('ZIP 不可超過 50 MB');let b=await file.arrayBuffer(),v=new DataView(b),u=new Uint8Array(b),e=-1;for(let i=Math.max(0,u.length-65557);i<=u.length-22;i++)if(zu32(v,i)===0x06054b50)e=i;if(e<0)throw Error('ZIP 已損壞');let count=zu16(v,e+10),p=zu32(v,e+16),out=new Map(),total=0;if(count>31)throw Error('ZIP 檔案數量超過限制');
 for(let i=0;i<count;i++){if(zu32(v,p)!==0x02014b50)throw Error('ZIP 目錄錯誤');let flags=zu16(v,p+8),method=zu16(v,p+10),cs=zu32(v,p+20),size=zu32(v,p+24),nl=zu16(v,p+28),xl=zu16(v,p+30),cl=zu16(v,p+32),lo=zu32(v,p+42),name=new TextDecoder().decode(u.slice(p+46,p+46+nl)).replace(/\\\\/g,'/');p+=46+nl+xl+cl;if(name.endsWith('/'))continue;if(flags&1)throw Error('不接受加密 ZIP');if(![0,8].includes(method)||name.startsWith('/')||name.includes('../'))throw Error('ZIP 格式或路徑不安全');let lnl=zu16(v,lo+26),lel=zu16(v,lo+28),start=lo+30+lnl+lel,raw=u.slice(start,start+cs),data=method===0?raw:await inflateRaw(raw);if(data.length!==size)throw Error('附件大小不符：'+name);total+=size;if(total>100*1024*1024)throw Error('解壓縮後超過 100 MB');out.set(name,data)}return out
}
async function previewCaseZip(file){
 let entries=await readCaseZip(file);if(!entries.has('case.json'))throw Error('ZIP 根目錄找不到 case.json');let m=JSON.parse(new TextDecoder().decode(entries.get('case.json')));if(m.schemaVersion!=='1.0'||!m.packageId||!m.case?.subject||!Array.isArray(m.deliveries)||!Array.isArray(m.documents)||!Array.isArray(m.artifacts))throw Error('case.json 格式不正確');
 let exact=await sb.from('case_imports').select('id').eq('package_id',m.packageId).maybeSingle();if(exact.data)throw Error('這個案件包已經匯入過，已阻擋重複匯入');for(let a of m.artifacts){let bytes=entries.get(a.path);if(!bytes)throw Error('缺少附件：'+a.path);if(bytes.length!==a.byteSize||await sha256Bytes(bytes)!==a.sha256)throw Error('附件校驗失敗：'+a.fileName)}
 let q=await sb.from('cases').select('id,subject,receive_date,external_key').is('deleted_at',null),dups=(q.data||[]).filter(x=>(m.case.externalKey&&x.external_key===m.case.externalKey)||(m.case.receiveDate&&x.receive_date===m.case.receiveDate&&x.subject.replace(/[\\s\\p{P}]+/gu,'').toLowerCase()===m.case.subject.replace(/[\\s\\p{P}]+/gu,'').toLowerCase()));return {file,entries,manifest:m,duplicates:dups,hash:await sha256Bytes(new Uint8Array(await file.arrayBuffer()))}
}
async function chooseCaseZip(e){
 let file=e.target.files[0];if(!file)return;let box=document.getElementById('caseImportResult');box.innerHTML='<div class="case-import-summary">驗證中…</div>';document.getElementById('caseCommitBtn').disabled=true;try{casePreview=await previewCaseZip(file);let m=casePreview.manifest;box.innerHTML='<div class="case-ok">ZIP 結構與附件校驗均通過</div><div class="case-import-summary"><strong>'+esc(m.case.subject)+'</strong><br>收文：'+esc(m.case.receiveDate||'未填')+'　文號：'+esc(m.case.externalKey||'未填')+'<br>繳交管道 '+m.deliveries.length+' 項、文件 '+m.documents.length+' 項、附件 '+m.artifacts.length+' 個</div>'+(m.warnings?.length?'<div class="case-warning">'+m.warnings.map(esc).join('<br>')+'</div>':'')+(casePreview.duplicates.length?'<div class="case-warning">發現疑似重複案件，匯入時會再次要求確認。</div>':'');document.getElementById('caseCommitBtn').disabled=false}catch(err){box.innerHTML='<div class="case-warning">'+esc(err.message||String(err))+'</div>'}}
async function commitCaseZip(){
 if(!casePreview)return;let p=casePreview,m=p.manifest,force=!p.duplicates.length||confirm('發現疑似重複案件。確定仍要建立新案件？');if(!force)return;document.getElementById('caseCommitBtn').disabled=true;let ir=await sb.from('case_imports').insert({package_id:m.packageId,schema_version:'1.0',package_sha256:p.hash,status:'committing',force_import:p.duplicates.length>0}).select('id').single();if(ir.error)return toast('建立匯入紀錄失敗');
 let cr=await sb.from('cases').insert({source_package_id:m.packageId,receive_date:m.case.receiveDate,external_key:p.duplicates.length?null:m.case.externalKey,subject:m.case.subject,content:m.case.content,note:[m.case.note,...(m.warnings||[]).map(w=>'匯入提醒：'+w)].filter(Boolean).join('\\n'),status:m.case.status}).select('id').single();if(cr.error){await sb.from('case_imports').update({status:'failed',error_message:cr.error.message}).eq('id',ir.data.id);return toast('案件匯入失敗')}let cid=cr.data.id,dmap=new Map(),omap=new Map();
 try{for(let [i,d] of m.deliveries.entries()){let r=await sb.from('deliveries').insert({case_id:cid,channel:d.channel,deadline:d.deadline,status:d.status,detail:d.detail,sort_order:i}).select('id').single();if(r.error)throw r.error;dmap.set(d.id,r.data.id)}for(let [i,d] of m.documents.entries()){let r=await sb.from('case_documents').insert({case_id:cid,name:d.name,format:d.format,source_type:d.sourceType,reference:d.reference,status:d.status,sort_order:i}).select('id').single();if(r.error)throw r.error;omap.set(d.id,r.data.id);let links=d.deliveryIds.map(x=>dmap.get(x)).filter(Boolean).map(x=>({document_id:r.data.id,delivery_id:x}));if(links.length){let l=await sb.from('document_deliveries').insert(links);if(l.error)throw l.error}}for(let a of m.artifacts){let did=omap.get(a.documentId),bytes=p.entries.get(a.path),path=currentUser.id+'/'+cid+'/'+did+'/'+crypto.randomUUID()+'-'+a.fileName.replace(/[\\\\/:*?"<>|]/g,'_'),up=await sb.storage.from('case-files').upload(path,new Blob([bytes],{type:a.mediaType}),{contentType:a.mediaType});if(up.error)throw up.error;let v=await sb.from('document_versions').insert({document_id:did,role:a.role,source_type:a.sourceType,version_number:1,version_label:a.versionLabel,file_name:a.fileName,storage_path:path,media_type:a.mediaType,byte_size:a.byteSize,sha256:a.sha256,is_current:a.isCurrent});if(v.error)throw v.error}await sb.from('case_imports').update({status:'completed',case_id:cid,completed_at:new Date().toISOString()}).eq('id',ir.data.id);selectedCaseId=cid;closeCaseImport();await loadCases();toast('案件與附件已一次匯入')}catch(err){await sb.from('cases').update({status:'archived',deleted_at:new Date().toISOString()}).eq('id',cid);await sb.from('case_imports').update({status:'failed',case_id:cid,error_message:err.message||String(err)}).eq('id',ir.data.id);toast('匯入失敗：'+(err.message||err))}
}
document.getElementById('caseAddBtn').onclick=()=>openCaseModal(null);document.getElementById('caseSaveBtn').onclick=saveCaseItem;document.getElementById('caseImportBtn').onclick=()=>{if(!needCaseLogin())return;document.getElementById('caseImportModal').classList.add('show')};document.getElementById('caseZipInput').onchange=chooseCaseZip;document.getElementById('caseCommitBtn').onclick=commitCaseZip;

const TAB_ORDER_KEY='tp.workspaceTabOrder';
const ACTIVE_TAB_KEY='tp.activeWorkspaceTab';
function activateWorkspace(tabName){
  document.querySelectorAll('.workspace-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabName));
  document.getElementById('teachingPage').classList.toggle('active',tabName==='teaching');
  document.getElementById('controlPage').classList.toggle('active',tabName==='control');if(tabName==='control'&&currentUser)loadCases();
  localStorage.setItem(ACTIVE_TAB_KEY,tabName);
}
function initWorkspaceTabs(){
  const bar=document.getElementById('workspaceTabs');
  let saved=[];try{saved=JSON.parse(localStorage.getItem(TAB_ORDER_KEY)||'[]')}catch{}
  if(Array.isArray(saved))saved.forEach(id=>{const el=bar.querySelector(`[data-tab="${id}"]`);if(el)bar.appendChild(el)});
  let dragged=null;
  bar.querySelectorAll('.workspace-tab').forEach(tab=>{
    tab.addEventListener('click',()=>activateWorkspace(tab.dataset.tab));
    tab.addEventListener('dragstart',e=>{dragged=tab;tab.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    tab.addEventListener('dragend',()=>{tab.classList.remove('dragging');bar.querySelectorAll('.workspace-tab').forEach(x=>x.classList.remove('drag-over'));dragged=null});
    tab.addEventListener('dragover',e=>{e.preventDefault();if(dragged&&dragged!==tab)tab.classList.add('drag-over')});
    tab.addEventListener('dragleave',()=>tab.classList.remove('drag-over'));
    tab.addEventListener('drop',e=>{e.preventDefault();tab.classList.remove('drag-over');if(!dragged||dragged===tab)return;const r=tab.getBoundingClientRect();bar.insertBefore(dragged,e.clientX<r.left+r.width/2?tab:tab.nextSibling);localStorage.setItem(TAB_ORDER_KEY,JSON.stringify([...bar.querySelectorAll('.workspace-tab')].map(x=>x.dataset.tab)))});
  });
  const active=localStorage.getItem(ACTIVE_TAB_KEY)||'teaching';activateWorkspace(bar.querySelector(`[data-tab="${active}"]`)?active:'teaching');
}
initWorkspaceTabs();
</script>
