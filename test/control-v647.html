<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>項目控管 v6.4.7 TEST</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f7fb;color:#25334a}.top{height:64px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.title{font-weight:800}.sub{font-size:11px;color:#94a3b8}.tabs{height:44px;background:#fff;border-bottom:1px solid #dbe3ef;padding:0 24px;display:flex;align-items:end}.tab{padding:11px 16px 10px;color:#64748b;font-weight:700}.tab.active{color:#2563eb;border-bottom:3px solid #2563eb}.page{padding:18px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.head h2{margin:0}.note{font-size:11px;color:#94a3b8}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button,.tools select,.mini{border:1px solid #dbe3ef;background:#fff;border-radius:7px;padding:8px 10px;color:#475569;cursor:pointer}.tools .primary{background:#2563eb;border-color:#2563eb;color:#fff}.wrap{overflow:auto;border:1px solid #dbe3ef;border-radius:10px}table{width:100%;min-width:1180px;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid #dbe3ef;border-bottom:1px solid #dbe3ef;padding:9px;vertical-align:top;font-size:12px;text-align:left}th{background:#f8fafc;position:sticky;top:0}th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}.receive{width:95px}.subject{width:180px}.detail{width:260px;white-space:pre-wrap}.docs{width:240px;white-space:pre-wrap}.channel{width:140px}.deadline{width:120px}.status{width:110px}.ops{width:90px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:700;font-size:11px}.open{background:#dbeafe;color:#1d4ed8}.doing{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.overdue{background:#fee2e2;color:#b91c1c}.muted{font-size:11px;color:#94a3b8;margin-top:6px}.modalback{display:none;position:fixed;inset:0;background:#0f172a55;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:18px}.modal h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#475569}input,textarea,select{width:100%;padding:9px;border:1px solid #dbe3ef;border-radius:7px;font:inherit}textarea{min-height:90px;resize:vertical}.deliverybox{border:1px solid #dbe3ef;border-radius:8px;padding:10px;margin-top:10px}.drow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}.drow button{height:39px;border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:7px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{padding:8px 12px;border:1px solid #dbe3ef;background:#fff;border-radius:7px}.actions .save{background:#2563eb;color:#fff;border-color:#2563eb}.actions .danger{margin-right:auto;color:#dc2626}.empty{text-align:center;padding:35px;color:#94a3b8}@media(max-width:800px){.head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top"><div><div class="title">班級教學進度排程</div><div class="sub">Item Control Prototype · Cloud v6.4.7 TEST</div></div></div><div class="tabs"><div class="tab">體育課課表</div><div class="tab active">項目控管</div></div><div class="page"><div class="card"><div class="head"><div><h2>項目控管</h2><div class="note">同一案件整組排序與篩選，交付管道不拆散</div></div><div class="tools"><button class="primary" id="add">＋ 新增項目</button><select id="sf"><option value="all">狀態：全部</option><option value="active">狀態：進行中</option><option value="open">狀態：未完成</option><option value="doing">狀態：辦理中</option><option value="done">狀態：已完成</option><option value="overdue">狀態：逾期</option></select><select id="cf"><option value="all">管道：全部</option></select><select id="sort"><option value="asc">期限：近 → 遠</option><option value="desc">期限：遠 → 近</option><option value="rd">收文：新 → 舊</option><option value="ra">收文：舊 → 新</option></select></div></div><div class="wrap"><table><thead><tr><th class="receive">收文時間</th><th class="subject">主旨</th><th class="detail">內容</th><th class="docs">待交付文件</th><th class="channel">交付管道</th><th class="deadline">交付時限</th><th class="status">狀態</th><th class="ops">操作</th></tr></thead><tbody id="body"></tbody></table></div></div></div><div class="modalback" id="mb"><div class="modal"><h3 id="mt">新增項目</h3><div class="grid"><div><label>收文時間</label><input id="receive" type="date"></div><div><label>主旨</label><input id="subject"></div><div class="full"><label>內容</label><textarea id="content"></textarea></div><div class="full"><label>待交付文件</label><textarea id="docs" placeholder="1.申請表【線上、紙本】&#10;2.Excel名冊【線上】"></textarea></div><div class="full"><label>備註</label><textarea id="note" style="min-height:60px"></textarea></div></div><div class="deliverybox"><b>交付任務</b><div id="de"></div><button class="mini" id="addd" style="margin-top:10px">＋ 新增交付管道</button></div><div class="actions"><button class="danger" id="del">刪除項目</button><button id="cancel">取消</button><button class="save" id="save">儲存</button></div></div></div><script>const K='tp.controlCases.v647',FK='tp.controlFilters.v647',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),today=()=>new Date().toISOString().slice(0,10);let cases=JSON.parse(localStorage.getItem(K)||'null')||[{id:uid(),receive:'2026-09-04',subject:'運動代表隊補助申請',content:'依公文完成申請資料彙整、核章與送件。',docs:'1. 申請表【線上、紙本】\n2. Excel名冊【線上】\n3. 核章附件【紙本】',note:'示範資料，可直接刪除。',deliveries:[{id:uid(),channel:'線上系統',deadline:'2026-09-15',status:'open',completedAt:''},{id:uid(),channel:'紙本寄送',deadline:'2026-09-20',status:'doing',completedAt:''}]},{id:uid(),receive:'2026-08-28',subject:'研習資料回覆',content:'完成承辦資料填報。',docs:'回覆表【Email】',note:'',deliveries:[{id:uid(),channel:'Email',deadline:'2026-09-05',status:'done',completedAt:'2026-09-03'}]}],edit=null;const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=v=>v?`${+v.slice(5,7)}/${+v.slice(8,10)}`:'未載明',over=d=>d.status!=='done'&&d.deadline&&d.deadline<today(),st=d=>over(d)?'overdue':d.status,txt={open:'未完成',doing:'辦理中',done:'已完成',overdue:'逾期'};function persist(){localStorage.setItem(K,JSON.stringify(cases))}persist();function key(c){let a=c.deliveries.filter(d=>d.status!=='done'&&d.deadline).map(d=>d.deadline).sort();return a[0]||c.deliveries.filter(d=>d.deadline).map(d=>d.deadline).sort()[0]||'9999-12-31'}function channels(){let old=$('cf').value,v=[...new Set(cases.flatMap(c=>c.deliveries.map(d=>d.channel).filter(Boolean)))].sort();$('cf').innerHTML='<option value="all">管道：全部</option>'+v.map(x=>`<option>${esc(x)}</option>`).join('');if(v.includes(old))$('cf').value=old}function render(){channels();let sf=$('sf').value,cf=$('cf').value,so=$('sort').value;localStorage.setItem(FK,JSON.stringify({sf,cf,so}));let a=cases.filter(c=>{let ss=c.deliveries.map(st);return(sf==='all'||sf==='active'&&ss.some(x=>x!=='done')||ss.includes(sf))&&(cf==='all'||c.deliveries.some(d=>d.channel===cf))});a.sort((x,y)=>so==='rd'?y.receive.localeCompare(x.receive):so==='ra'?x.receive.localeCompare(y.receive):so==='desc'?key(y).localeCompare(key(x)):key(x).localeCompare(key(y)));$('body').innerHTML=a.length?a.map(c=>{let ds=c.deliveries.length?c.deliveries:[{channel:'—',deadline:'',status:'open'}];return ds.map((d,i)=>`<tr>${i?'':`<td rowspan="${ds.length}">${fmt(c.receive)}</td><td rowspan="${ds.length}"><b>${esc(c.subject)}</b>${c.note?`<div class="muted">備註：${esc(c.note)}</div>`:''}</td><td rowspan="${ds.length}" class="detail">${esc(c.content)}</td><td rowspan="${ds.length}" class="docs">${esc(c.docs)}</td>`}<td>${esc(d.channel||'—')}</td><td>${fmt(d.deadline)}</td><td><span class="pill ${st(d)}">${txt[st(d)]}</span>${d.completedAt?`<div class="muted">${fmt(d.completedAt)}完成</div>`:''}</td>${i?'':`<td rowspan="${ds.length}"><button class="mini" onclick="openCase('${c.id}')">編輯</button></td>`}</tr>`).join('')}).join(''):'<tr><td colspan="8" class="empty">沒有符合篩選條件的項目</td></tr>'}function drow(d={}){let x=document.createElement('div');x.className='drow';x.dataset.id=d.id||uid();x.innerHTML=`<div><label>交付管道</label><input class="ch" value="${esc(d.channel)}" placeholder="線上系統／紙本／Email"></div><div><label>交付時限</label><input class="dl" type="date" value="${d.deadline||''}"></div><div><label>狀態</label><select class="ss"><option value="open">未完成</option><option value="doing">辦理中</option><option value="done">已完成</option></select></div><button>刪除</button>`;x.querySelector('.ss').value=d.status||'open';x.querySelector('button').onclick=()=>x.remove();$('de').appendChild(x)}window.openCase=function(id){edit=id||null;let c=id?cases.find(x=>x.id===id):null;$('mt').textContent=c?'編輯項目':'新增項目';$('receive').value=c?.receive||today();$('subject').value=c?.subject||'';$('content').value=c?.content||'';$('docs').value=c?.docs||'';$('note').value=c?.note||'';$('de').innerHTML='';(c?.deliveries?.length?c.deliveries:[{}]).forEach(drow);$('del').style.display=c?'block':'none';$('mb').classList.add('show')};function close(){$('mb').classList.remove('show');edit=null}$('add').onclick=()=>openCase();$('addd').onclick=()=>drow();$('cancel').onclick=close;$('save').onclick=()=>{let subject=$('subject').value.trim();if(!subject)return alert('請輸入主旨');let old=edit?cases.find(x=>x.id===edit):null,ds=[...document.querySelectorAll('.drow')].map(r=>{let status=r.querySelector('.ss').value,o=old?.deliveries.find(d=>d.id===r.dataset.id);return{id:r.dataset.id,channel:r.querySelector('.ch').value.trim(),deadline:r.querySelector('.dl').value,status,completedAt:status==='done'?(o?.status==='done'&&o.completedAt?o.completedAt:today()):''}}).filter(d=>d.channel||d.deadline),c={id:edit||uid(),receive:$('receive').value,subject,content:$('content').value.trim(),docs:$('docs').value.trim(),note:$('note').value.trim(),deliveries:ds};cases=edit?cases.map(x=>x.id===edit?c:x):[...cases,c];persist();close();render()};$('del').onclick=()=>{if(edit&&confirm('確定刪除這個項目？')){cases=cases.filter(x=>x.id!==edit);persist();close();render()}};['sf','cf','sort'].forEach(id=>$(id).onchange=render);let f=JSON.parse(localStorage.getItem(FK)||'null');if(f){$('sf').value=f.sf||'all';$('sort').value=f.so||'asc'}render();if(f?.cf){$('cf').value=f.cf;render()}</script></body></html>
