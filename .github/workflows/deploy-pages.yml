name: Build and Publish Web App

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app-source.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - run: cp app-source.html index.html
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist
          if-no-files-found: error
      - name: Publish compiled files for branch-based Pages
        run: |
          mkdir -p next/assets
          cp dist/index.html next/index.html
          cp -R dist/assets/. next/assets/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next .nojekyll
          git diff --cached --quiet || git commit -m "build: publish web app [skip ci]"
          git push
