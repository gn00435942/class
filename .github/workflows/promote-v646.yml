name: Promote v6.4.6 to production

on:
  push:
    paths:
      - '.github/workflows/promote-v646.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote tested standalone v6.4.6
        shell: bash
        run: |
          cp test/index.html index.html
          sed -i 's/Cloud v6\.4\.6 TEST/Cloud v6.4.6/' index.html
          grep -q 'Cloud v6.4.6' index.html
          ! grep -q 'raw.githubusercontent.com' index.html
          ! grep -q 'v642.js' index.html
          ! grep -q 'document.write(' index.html
      - name: Commit production v6.4.6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "release: promote standalone v6.4.6"
          git push origin main
