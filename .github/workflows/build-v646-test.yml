name: Build standalone v6.4.6 test

on:
  push:
    paths:
      - '.github/workflows/build-v646-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean standalone test page
        shell: bash
        run: |
          git fetch origin staging
          git show origin/staging:index.html > /tmp/base.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/base.html').read_text(encoding='utf-8')

          old_css='.toggle button.active{background:var(--blue);color:#fff}.app{height:calc(100vh - 64px);display:flex}'
          new_css='.toggle button.active{background:var(--blue);color:#fff}.workspace-tabs{height:44px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 24px;gap:6px}.workspace-tab{border:0;background:transparent;color:#64748b;padding:11px 16px 10px;cursor:grab;font-weight:700;border-bottom:3px solid transparent;user-select:none}.workspace-tab:active{cursor:grabbing}.workspace-tab.dragging{opacity:.45}.workspace-tab.drag-over{background:#eff6ff;border-radius:8px 8px 0 0}.workspace-tab.active{color:var(--blue);border-bottom-color:var(--blue)}.workspace-page{display:none;height:calc(100vh - 108px)}.workspace-page.active{display:block}.app{height:100%;display:flex}.control-page{height:100%;overflow:auto;padding:24px;background:var(--bg)}.control-card{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 2px rgba(15,23,42,.03)}.control-card h2{margin:0 0 8px;font-size:20px}.control-card p{margin:0;color:#64748b;line-height:1.7}.control-placeholder{margin-top:18px;border:1px dashed #cbd5e1;border-radius:10px;padding:28px;text-align:center;color:#94a3b8;background:#f8fafc}'
          assert old_css in s
          s=s.replace(old_css,new_css,1)

          s=s.replace('Cloud v6.3.3','Cloud v6.4.6 TEST',1)

          old_open='<div class="app"><aside class="side"><h3>班級管理</h3><div class="addrow"><input id="classInput" placeholder="例如 604"><button id="addClassBtn">新增</button></div>'
          new_open='<div id="workspaceTabs" class="workspace-tabs"><button class="workspace-tab active" draggable="true" data-tab="teaching">體育課課表</button><button class="workspace-tab" draggable="true" data-tab="control">項目控管</button></div>\n<section id="teachingPage" class="workspace-page active"><div class="app"><aside class="side"><h3>班級管理</h3><div class="addrow"><input id="classInput" name="className" autocomplete="off" readonly placeholder="例如 604"><button id="addClassBtn">新增</button></div>'
          assert old_open in s
          s=s.replace(old_open,new_open,1)

          old_close='</main></div>\n\n<div id="loginModal"'
          new_close='</main></div>\n</section>\n<section id="controlPage" class="workspace-page"><div class="control-page"><div class="control-card"><h2>項目控管</h2><p>這一頁已和體育課課表分開，先保留為獨立工作區。</p><div class="control-placeholder">項目控管功能區</div></div></div></section>\n\n<div id="loginModal"'
          assert old_close in s
          s=s.replace(old_close,new_close,1)

          old_bind="document.getElementById('addClassBtn').onclick=addClass;document.getElementById('classInput').addEventListener('keydown',e=>{if(e.key==='Enter')addClass()});"
          new_bind="document.getElementById('addClassBtn').onclick=addClass;const classInput=document.getElementById('classInput');classInput.addEventListener('focus',()=>classInput.removeAttribute('readonly'),{once:true});classInput.addEventListener('keydown',e=>{if(e.key==='Enter')addClass()});"
          assert old_bind in s
          s=s.replace(old_bind,new_bind,1)

          tab_js=r'''

const TAB_ORDER_KEY='tp.workspaceTabOrder';
const ACTIVE_TAB_KEY='tp.activeWorkspaceTab';
function activateWorkspace(tabName){
  document.querySelectorAll('.workspace-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabName));
  document.getElementById('teachingPage').classList.toggle('active',tabName==='teaching');
  document.getElementById('controlPage').classList.toggle('active',tabName==='control');
  localStorage.setItem(ACTIVE_TAB_KEY,tabName);
}
function initWorkspaceTabs(){
  const bar=document.getElementById('workspaceTabs');
  let saved=[];try{saved=JSON.parse(localStorage.getItem(TAB_ORDER_KEY)||'[]')}catch{}
  if(Array.isArray(saved))saved.forEach(id=>{const el=bar.querySelector(`[data-tab="${id}"]`);if(el)bar.appendChild(el)});
  let dragged=null;
  bar.querySelectorAll('.workspace-tab').forEach(tab=>{
    tab.addEventListener('click',()=>activateWorkspace(tab.dataset.tab));
    tab.addEventListener('dragstart',e=>{dragged=tab;tab.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    tab.addEventListener('dragend',()=>{tab.classList.remove('dragging');bar.querySelectorAll('.workspace-tab').forEach(x=>x.classList.remove('drag-over'));dragged=null});
    tab.addEventListener('dragover',e=>{e.preventDefault();if(dragged&&dragged!==tab)tab.classList.add('drag-over')});
    tab.addEventListener('dragleave',()=>tab.classList.remove('drag-over'));
    tab.addEventListener('drop',e=>{e.preventDefault();tab.classList.remove('drag-over');if(!dragged||dragged===tab)return;const r=tab.getBoundingClientRect();bar.insertBefore(dragged,e.clientX<r.left+r.width/2?tab:tab.nextSibling);localStorage.setItem(TAB_ORDER_KEY,JSON.stringify([...bar.querySelectorAll('.workspace-tab')].map(x=>x.dataset.tab)))});
  });
  const active=localStorage.getItem(ACTIVE_TAB_KEY)||'teaching';
  activateWorkspace(bar.querySelector(`[data-tab="${active}"]`)?active:'teaching');
}
initWorkspaceTabs();
'''
          anchor='</script>\n</body></html>'
          assert anchor in s
          s=s.replace(anchor,tab_js+anchor,1)

          checks=[
            'Cloud v6.4.6 TEST',
            'fetchCalendarEventsFromCutoff',
            '.range(from,from+pageSize-1)',
            'async function importICSFiles',
            'async function clearImported',
            'async function initAuth',
            'workspaceTabs',
            'autocomplete="off"',
            'readonly placeholder="例如 604"',
          ]
          for x in checks:
            assert x in s, x
          for bad in ['raw.githubusercontent.com','v642.js','document.write(']:
            assert bad not in s, bad
          Path('test/index.html').write_text(s,encoding='utf-8')
          PY
      - name: Commit generated standalone test page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/index.html
          git diff --cached --quiet && exit 0
          git commit -m "test: standalone clean v6.4.6"
          git push origin main
