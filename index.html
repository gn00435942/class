<header class="topbar"><div class="brand"><div class="logo">▦</div><div><div class="title">班級教學進度排程</div><div class="subtitle">Class Teaching Progress Scheduler · Cloud v6.3.3</div></div></div><div style="display:flex;align-items:center"><div class="toggle"><button id="weekBtn">週檢視</button><button id="monthBtn" class="active">月檢視</button></div><div class="authbox"><span id="authStatus" class="authstatus">未登入</span><button id="loginBtn" class="authbtn primary">登入</button><button id="logoutBtn" class="authbtn" style="display:none">登出</button></div></div></header>
<div class="app"><aside class="side"><h3>班級管理</h3><div class="addrow"><input id="classInput" placeholder="例如 604"><button id="addClassBtn">新增</button></div><div id="classList"></div><div class="importbox"><h4>Google 日曆匯入</h4><p>可匯入 Google Calendar 匯出的 .ics 檔。支援一次選擇多個行事曆檔案，登入後會同步保存到 Supabase 雲端，其他電腦登入也能看到。</p><input id="icsInput" type="file" accept=".ics,text/calendar" multiple hidden><button id="importIcsBtn" class="importbtn">匯入 .ics 行事曆</button><button id="clearImportedBtn" class="clearbtn">清除已匯入行事曆</button><div id="importStatus" class="importstatus"></div></div></aside><main class="main"><div class="nav"><div class="navleft"><button id="prevBtn">‹</button><div id="periodLabel" class="monthlabel"></div><button id="nextBtn">›</button><button id="todayBtn">今天</button></div><div id="viewHint" class="hint">整月進度總覽</div></div><div id="schedule" class="content month"></div></main></div>

<div id="loginModal" class="modalback"><div class="modal loginpanel"><h3>管理員登入</h3><div class="meta">登入後班級、教學進度與行事曆會與 Supabase 雲端同步。</div><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="密碼"><div id="loginError" class="cloudnote"></div><div class="actions"><button onclick="closeLogin()">取消</button><button id="doLoginBtn" class="primary">登入</button></div></div></div>

<div id="eventModal" class="modalback"><div class="modal"><h3>行事曆事件</h3><div id="eventMeta" class="meta"></div><div id="eventList"></div><input id="eventInput" placeholder="例如：教師會議、校慶"><div class="actions"><button onclick="closeEvent()">取消</button><button id="addEvent" class="primary">新增事件</button></div></div></div>

<script>
const SUPABASE_URL='https://tiirqeoptszgnexzpigw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_bVKOO37mrGJDKW3tEMxKOQ_s7nOfITn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null;
const K={classes:'tp.classes',entries:'tp.entries',events:'tp.events'};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const load=(k,d)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
let classes=load(K.classes,[{id:'c1',name:'601'},{id:'c2',name:'602'},{id:'c3',name:'603'}]);
let entries=load(K.entries,[]), events=load(K.events,[]);
if(!localStorage.getItem(K.events)){events=[['2026-09-01','開學日'],['2026-09-10','教師會議'],['2026-09-15','校慶'],['2026-09-20','放假'],['2026-09-25','游泳課']].map(x=>({id:uid(),date:x[0],title:x[1],source:'sample'}));}
let mode='month', anchor=new Date(2026,8,1), editing=null,eventDate=null;
const save=()=>{localStorage.setItem(K.classes,JSON.stringify(classes));localStorage.setItem(K.entries,JSON.stringify(entries));localStorage.setItem(K.events,JSON.stringify(events));};
const pad=n=>String(n).padStart(2,'0'); const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; const wd=['日','一','二','三','四','五','六'];
const sameDay=(a,b)=>a.toDateString()===b.toDateString(); const today=new Date();
function calendarCutoff(){return `${new Date().getFullYear()-1}-01-01`}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function firstLine(s=''){return String(s).split(/\r?\n/)[0]}
function tooltipText(s=''){return String(s).replace(/\r?\n/g,' ↵ ')}
function monthWeeks(y,m){let first=new Date(y,m,1), last=new Date(y,m+1,0), start=new Date(first);start.setDate(first.getDate()-first.getDay());let end=new Date(last);end.setDate(last.getDate()+(6-last.getDay()));let out=[];for(let d=new Date(start);d<=end;){let w=[];for(let i=0;i<7;i++){w.push(new Date(d));d.setDate(d.getDate()+1)}out.push(w)}return out}
function weekDays(d){let s=new Date(d);s.setDate(d.getDate()-d.getDay());return Array.from({length:7},(_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return x})}
function renderClasses(){let box=document.getElementById('classList');box.innerHTML=classes.map(c=>`<div class="classitem"><span>${esc(c.name)}</span><button title="刪除" onclick="removeClass('${c.id}')">🗑</button></div>`).join('')||'<div class="empty">尚無班級</div>'}
async function addClass(){let input=document.getElementById('classInput');let name=input.value.trim();if(!name)return;if(classes.some(c=>c.name===name)){toast('這個班級已存在');return}if(!currentUser){toast('請先登入才能新增班級');openLogin();return}let {data,error}=await sb.from('classes').insert({name}).select().single();if(error){console.error(error);toast('雲端新增失敗');return}classes.push({id:'db-'+data.id,name:data.name,dbId:data.id});input.value='';save();render();toast('已新增 '+name)}
async function removeClass(id){let c=classes.find(x=>x.id===id);if(!c)return;if(!currentUser){toast('請先登入才能刪除班級');openLogin();return}if(!confirm(`確定刪除 ${c.name}？這台電腦中該班教學進度也會刪除。`))return;let q=sb.from('classes').delete();q=c.dbId?q.eq('id',c.dbId):q.eq('name',c.name);let {error}=await q;if(error){console.error(error);toast('雲端刪除失敗');return}classes=classes.filter(x=>x.id!==id);entries=entries.filter(x=>x.classId!==id);save();render();toast('已刪除 '+c.name)}
function setMode(m){mode=m;document.getElementById('weekBtn').classList.toggle('active',m==='week');document.getElementById('monthBtn').classList.toggle('active',m==='month');document.getElementById('viewHint').textContent=m==='month'?'整月進度總覽':'單週放大檢視';renderSchedule()}
function changePeriod(n){if(mode==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);else{anchor=new Date(anchor);anchor.setDate(anchor.getDate()+7*n)}renderSchedule()}
function renderSchedule(){let lab=document.getElementById('periodLabel');lab.textContent=`${anchor.getFullYear()}年${anchor.getMonth()+1}月`;let el=document.getElementById('schedule');el.className='content '+mode;if(mode==='month')renderMonth(el);else renderWeek(el)}
function eventHTML(d){let a=events.filter(e=>e.date===key(d));return a.map(e=>`<span class="eventchip" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}
function renderMonth(el){let weeks=monthWeeks(anchor.getFullYear(),anchor.getMonth());el.innerHTML=weeks.map((week,wi)=>{let ds=week.map(d=>{let muted=d.getMonth()!==anchor.getMonth()?' muted':'';let weekend=(d.getDay()==0||d.getDay()==6)?' weekend':'';return `<th class="datehead${muted}${weekend}">${d.getMonth()+1}/${d.getDate()}<div class="wd">星期${wd[d.getDay()]}</div></th>`}).join('');let ev=week.map(d=>`<td class="eventcell" onclick="openEvent('${key(d)}')">${eventHTML(d)}</td>`).join('');let rows=classes.map(c=>`<tr><td class="classname">${esc(c.name)}</td>${week.map(d=>{let e=entries.find(x=>x.classId===c.id&&x.date===key(d));let mut=d.getMonth()!==anchor.getMonth()?' muted':'';let weekend=(d.getDay()==0||d.getDay()==6)?' weekend':'';return `<td class="progresscell${mut}${weekend}" onclick="openProgress('${c.id}','${key(d)}')" title="${e?esc(tooltipText(e.content)):''}">${e?`<span class="progresschip">${esc(firstLine(e.content))}</span>`:''}</td>`}).join('')}</tr>`).join('');return `<div class="weekcard"><div class="weektitle">第 ${wi+1} 週　${week[0].getMonth()+1}/${week[0].getDate()} ～ ${week[6].getMonth()+1}/${week[6].getDate()}</div><table><thead><tr><th class="datehead">班級</th>${ds}</tr><tr><th class="calendar-label">行事曆</th>${ev}</tr></thead><tbody>${rows||`<tr><td colspan="8" class="empty">請先在左側新增班級</td></tr>`}</tbody></table></div>`}).join('')}
function renderWeek(el){let days=weekDays(anchor);let hs=days.map(d=>`<th class="datehead ${(d.getDay()==0||d.getDay()==6)?'weekend':''}">${d.getMonth()+1}/${d.getDate()}<div class="wd">星期${wd[d.getDay()]}</div></th>`).join('');let ev=days.map(d=>`<td class="eventcell" onclick="openEvent('${key(d)}')">${eventHTML(d)}</td>`).join('');let rows=classes.map(c=>`<tr><td class="classname">${esc(c.name)}</td>${days.map(d=>{let e=entries.find(x=>x.classId===c.id&&x.date===key(d));return `<td class="progresscell ${(d.getDay()==0||d.getDay()==6)?'weekend':''}" onclick="openProgress('${c.id}','${key(d)}')">${e?`<span class="progresschip">${esc(firstLine(e.content))}</span>`:''}</td>`}).join('')}</tr>`).join('');el.innerHTML=`<div class="weekwrap"><table><thead><tr><th class="datehead">班級</th>${hs}</tr><tr><th class="calendar-label">行事曆</th>${ev}</tr></thead><tbody>${rows||`<tr><td colspan="8" class="empty">請先在左側新增班級</td></tr>`}</tbody></table></div>`}
function openProgress(cid,date){let c=classes.find(x=>x.id===cid);let e=entries.find(x=>x.classId===cid&&x.date===date);editing={cid,date};document.getElementById('progressMeta').textContent=`${c?.name||''}　${date}`;document.getElementById('progressInput').value=e?.content||'';document.getElementById('deleteProgress').style.visibility=e?'visible':'hidden';document.getElementById('progressModal').classList.add('show');setTimeout(()=>document.getElementById('progressInput').focus(),0)}
function closeProgress(){document.getElementById('progressModal').classList.remove('show');editing=null}
async function saveProgress(){if(!editing)return;let content=document.getElementById('progressInput').value.trim();if(!content)return;if(!currentUser){toast('請先登入才能儲存教學進度');openLogin();return}let c=classes.find(x=>x.id===editing.cid);if(!c||!c.dbId){toast('班級尚未完成雲端同步');return}let e=entries.find(x=>x.classId===editing.cid&&x.date===editing.date);if(e&&e.dbId){let {data,error}=await sb.from('progress_entries').update({title:content}).eq('id',e.dbId).select().single();if(error){console.error(error);toast('雲端修改失敗');return}e.content=data.title}else{let {data,error}=await sb.from('progress_entries').insert({class_id:c.dbId,date:editing.date,title:content}).select().single();if(error){console.error(error);toast('雲端儲存失敗');return}if(e){e.dbId=data.id;e.content=data.title}else entries.push({id:'dbp-'+data.id,dbId:data.id,classId:editing.cid,date:data.date,content:data.title})}save();closeProgress();renderSchedule();toast('教學進度已同步到雲端')}
async function deleteProgress(){if(!editing)return;if(!currentUser){toast('請先登入才能刪除教學進度');openLogin();return}let e=entries.find(x=>x.classId===editing.cid&&x.date===editing.date);if(e?.dbId){let {error}=await sb.from('progress_entries').delete().eq('id',e.dbId);if(error){console.error(error);toast('雲端刪除失敗');return}}else{let c=classes.find(x=>x.id===editing.cid);if(c?.dbId){let {error}=await sb.from('progress_entries').delete().eq('class_id',c.dbId).eq('date',editing.date);if(error){console.error(error);toast('雲端刪除失敗');return}}}entries=entries.filter(x=>!(x.classId===editing.cid&&x.date===editing.date));save();closeProgress();renderSchedule();toast('教學進度已從雲端刪除')}
function openEvent(date){eventDate=date;document.getElementById('eventMeta').textContent=date;renderEventList();document.getElementById('eventInput').value='';document.getElementById('eventModal').classList.add('show')}
function renderEventList(){let list=events.filter(e=>e.date===eventDate);document.getElementById('eventList').innerHTML=list.map(e=>`<div class="classitem"><span>${esc(e.title)}</span><button onclick="deleteEvent('${e.id}')">🗑</button></div>`).join('')}
function closeEvent(){document.getElementById('eventModal').classList.remove('show');eventDate=null}
async function addEvent(){let t=document.getElementById('eventInput').value.trim();if(!t||!eventDate)return;if(!currentUser){toast('請先登入才能新增行事曆事件');openLogin();return}let {data,error}=await sb.from('calendar_events').insert({event_date:eventDate,title:t,source:'manual'}).select().single();if(error){console.error(error);toast('雲端新增事件失敗');return}events.push({id:'dbe-'+data.id,dbId:data.id,date:data.event_date,title:data.title,source:data.source});save();renderEventList();renderSchedule();document.getElementById('eventInput').value='';toast('行事曆事件已同步到雲端')}
async function deleteEvent(id){let e=events.find(x=>x.id===id);if(!e)return;if(!currentUser){toast('請先登入才能刪除行事曆事件');openLogin();return}if(e.dbId){let {error}=await sb.from('calendar_events').delete().eq('id',e.dbId);if(error){console.error(error);toast('雲端刪除事件失敗');return}}events=events.filter(x=>x.id!==id);save();renderEventList();renderSchedule();toast('行事曆事件已從雲端刪除')}
function unfoldICS(text){return text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/)}
function icsUnescape(s=''){return s.replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\')}
function parseIcsDate(raw){if(!raw)return null;let v=raw.trim();let m=v.match(/^(\d{4})(\d{2})(\d{2})/);if(!m)return null;return `${m[1]}-${m[2]}-${m[3]}`}
function addDaysKey(dateKey,n){let [y,m,d]=dateKey.split('-').map(Number);let x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return key(x)}
function expandRRule(startKey,rrule,limitEnd){if(!rrule)return [startKey];let parts=Object.fromEntries(rrule.split(';').map(p=>{let i=p.indexOf('=');return [p.slice(0,i),p.slice(i+1)]}));let freq=parts.FREQ, interval=Number(parts.INTERVAL||1), count=Number(parts.COUNT||0), until=parseIcsDate(parts.UNTIL||'');let maxEnd=until||limitEnd;let out=[startKey], [y,m,d]=startKey.split('-').map(Number);let cur=new Date(y,m-1,d), guard=0;while(guard++<1500){if(count&&out.length>=count)break;if(freq==='DAILY')cur.setDate(cur.getDate()+interval);else if(freq==='WEEKLY')cur.setDate(cur.getDate()+7*interval);else if(freq==='MONTHLY')cur.setMonth(cur.getMonth()+interval);else if(freq==='YEARLY')cur.setFullYear(cur.getFullYear()+interval);else break;let k=key(cur);if(maxEnd&&k>maxEnd)break;if(!maxEnd&&out.length>=260)break;out.push(k)}return out}
function parseICS(text,fileName){let lines=unfoldICS(text), result=[], ev=null;for(let line of lines){if(line==='BEGIN:VEVENT'){ev={};continue}if(line==='END:VEVENT'){if(ev&&ev.dtstart&&ev.summary){let start=parseIcsDate(ev.dtstart);if(start){let dates=expandRRule(start,ev.rrule,'2035-12-31');for(let date of dates)result.push({id:uid(),date,title:icsUnescape(ev.summary),source:'ics',calendar:fileName,icsUid:ev.uid||'',importedAt:Date.now()})}}ev=null;continue}if(!ev)continue;let idx=line.indexOf(':');if(idx<0)continue;let left=line.slice(0,idx), val=line.slice(idx+1);let prop=left.split(';')[0].toUpperCase();if(prop==='DTSTART')ev.dtstart=val;else if(prop==='SUMMARY')ev.summary=val;else if(prop==='RRULE')ev.rrule=val;else if(prop==='UID')ev.uid=val}return result}
async function importICSFiles(files){if(!currentUser){toast('請先登入才能匯入並同步行事曆');openLogin();return}let all=[];for(let f of files){try{let text=await f.text();all.push(...parseICS(text,f.name))}catch(e){console.error(e)}}if(!all.length){toast('沒有讀到可匯入的事件');return}const cutoff=calendarCutoff();all=all.filter(e=>e.date>=cutoff);if(!all.length){document.getElementById('importStatus').textContent=`沒有符合範圍的事件（只保留 ${cutoff} 之後）`;toast('沒有符合保留範圍的事件');return}let {data:cloud,error:cloudError}=await sb.from('calendar_events').select('event_date,title,source').gte('event_date',cutoff);if(cloudError){console.error(cloudError);toast('讀取雲端行事曆失敗');return}let existing=new Set((cloud||[]).map(e=>`${e.event_date}|${e.title}|${e.source||'ics'}`));let rows=[];for(let e of all){let sig=`${e.date}|${e.title}|ics`;if(!existing.has(sig)){rows.push({event_date:e.date,title:e.title,source:'ics'});existing.add(sig)}}if(!rows.length){document.getElementById('importStatus').textContent=`沒有新增事件（符合範圍 ${all.length} 筆，皆已存在）`;toast('沒有新的行事曆事件');await syncCalendarFromCloud();return}let {data,error}=await sb.from('calendar_events').insert(rows).select('id,event_date,title,source');if(error){console.error(error);toast('行事曆上傳雲端失敗');return}await syncCalendarFromCloud();document.getElementById('importStatus').textContent=`已新增 ${data.length} 筆事件；只保留 ${cutoff} 之後資料`;toast(`已同步 ${data.length} 筆行事曆事件到雲端`)}
async function clearImported(){let n=events.filter(e=>e.source==='ics').length;if(!n){toast('目前沒有匯入的行事曆');return}if(!confirm(`確定清除 ${n} 筆由 .ics 匯入的事件？手動新增的事件會保留。`))return;if(!currentUser){toast('請先登入才能清除雲端行事曆');openLogin();return}let {error}=await sb.from('calendar_events').delete().eq('source','ics');if(error){console.error(error);toast('清除雲端行事曆失敗');return}events=events.filter(e=>e.source!=='ics');save();renderSchedule();document.getElementById('importStatus').textContent='已清除雲端匯入的行事曆事件';toast('已清除雲端匯入事件')}

function openLogin(){document.getElementById('loginError').textContent='';document.getElementById('loginModal').classList.add('show');setTimeout(()=>document.getElementById('loginEmail').focus(),0)}
function closeLogin(){document.getElementById('loginModal').classList.remove('show');document.getElementById('loginPassword').value=''}
function updateAuthUI(){let s=document.getElementById('authStatus'),li=document.getElementById('loginBtn'),lo=document.getElementById('logoutBtn');if(currentUser){s.textContent=currentUser.email||'已登入';li.style.display='none';lo.style.display='inline-block'}else{s.textContent='未登入';li.style.display='inline-block';lo.style.display='none'}}
async function login(){let email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){document.getElementById('loginError').textContent='請輸入 Email 與密碼';return}document.getElementById('loginError').textContent='登入中…';let {data,error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById('loginError').textContent='登入失敗：'+error.message;return}currentUser=data.user;closeLogin();updateAuthUI();await syncClassesFromCloud();await syncProgressFromCloud();await syncCalendarFromCloud();toast('登入成功，班級、教學進度與行事曆已同步')}
async function logout(){await sb.auth.signOut();currentUser=null;updateAuthUI();toast('已登出')}
async function syncClassesFromCloud(){if(!currentUser)return;let {data,error}=await sb.from('classes').select('id,name').order('id');if(error){console.error(error);toast('讀取雲端班級失敗');return}if(!data.length&&classes.length){let names=[...new Set(classes.map(c=>c.name).filter(Boolean))];let seeded=await sb.from('classes').insert(names.map(name=>({name})));if(seeded.error){console.error(seeded.error);toast('初次上傳班級失敗');return}let r=await sb.from('classes').select('id,name').order('id');if(r.error){console.error(r.error);return}data=r.data}let oldByName=new Map(classes.map(c=>[c.name,c]));classes=data.map(row=>{let old=oldByName.get(row.name);return {id:old?.id||('db-'+row.id),name:row.name,dbId:row.id}});save();render()}
async function syncProgressFromCloud(){
if(!currentUser)return;
let {data,error}=await sb.from('progress_entries').select('id,class_id,date,title').order('date');
if(error){console.error(error);toast('讀取雲端教學進度失敗');return}
if(!data.length&&entries.length){
  let rows=[];
  for(let e of entries){
    let c=classes.find(x=>x.id===e.classId);
    if(c?.dbId&&e.date&&e.content)rows.push({class_id:c.dbId,date:e.date,title:e.content});
  }
  if(rows.length){
    let seeded=await sb.from('progress_entries').insert(rows);
    if(seeded.error){console.error(seeded.error);toast('初次上傳教學進度失敗');return}
    let r=await sb.from('progress_entries').select('id,class_id,date,title').order('date');
    if(r.error){console.error(r.error);return}
    data=r.data;
  }
}
let localByDbClass=new Map(classes.filter(c=>c.dbId).map(c=>[String(c.dbId),c]));
entries=data.map(row=>{
  let c=localByDbClass.get(String(row.class_id));
  return {id:'dbp-'+row.id,dbId:row.id,classId:c?.id||('db-'+row.class_id),date:row.date,content:row.title};
}).filter(e=>classes.some(c=>c.id===e.classId));
save();render();
}
async function fetchCalendarEventsFromCutoff(){
  const pageSize=1000, cutoff=calendarCutoff();let from=0;let all=[];
  while(true){
    let {data,error}=await sb.from('calendar_events')
      .select('id,event_date,title,source')
      .gte('event_date',cutoff)
      .order('event_date',{ascending:true})
      .order('id',{ascending:true})
      .range(from,from+pageSize-1);
    if(error)return {data:null,error};
    all.push(...(data||[]));
    if(!data||data.length<pageSize)break;
    from+=pageSize;
  }
  return {data:all,error:null};
}
async function syncCalendarFromCloud(){
if(!currentUser)return;
let {data,error}=await fetchCalendarEventsFromCutoff();
if(error){console.error(error);toast('讀取雲端行事曆失敗');return}
if(!data.length){
  let localRows=[];let seen=new Set();
  for(let e of events){
    if(e.source==='sample'||!e.date||!e.title||e.date<calendarCutoff())continue;
    let sig=`${e.date}|${e.title}`;if(seen.has(sig))continue;seen.add(sig);
    localRows.push({event_date:e.date,title:e.title,source:e.source==='ics'?'ics':'manual'});
  }
  if(localRows.length){
    let seeded=await sb.from('calendar_events').insert(localRows);
    if(seeded.error){console.error(seeded.error);toast('初次上傳行事曆失敗');return}
    let r=await fetchCalendarEventsFromCutoff();
    if(r.error){console.error(r.error);toast('重新讀取雲端行事曆失敗');return}
    data=r.data;
  }
}
events=data.map(row=>({id:'dbe-'+row.id,dbId:row.id,date:row.event_date,title:row.title,source:row.source||'manual'}));
save();renderSchedule();
document.getElementById('importStatus').textContent=`雲端行事曆已同步：${calendarCutoff()} 之後，共 ${events.length} 筆事件`;
}
async function initAuth(){let {data}=await sb.auth.getSession();currentUser=data.session?.user||null;updateAuthUI();if(currentUser){await syncClassesFromCloud();await syncProgressFromCloud();await syncCalendarFromCloud()}}

function render(){renderClasses();renderSchedule()}

  if(e.key==='Enter'){
    e.stopPropagation();
    // Do NOT preventDefault: textarea keeps its native newline behavior.
  }
});
document.getElementById('progressInput').addEventListener('keypress',e=>{
  if(e.key==='Enter') e.stopPropagation();
});
document.getElementById('loginBtn').onclick=openLogin;document.getElementById('logoutBtn').onclick=logout;document.getElementById('doLoginBtn').onclick=login;document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('addClassBtn').onclick=addClass;document.getElementById('classInput').addEventListener('keydown',e=>{if(e.key==='Enter')addClass()});document.getElementById('weekBtn').onclick=()=>setMode('week');document.getElementById('monthBtn').onclick=()=>setMode('month');document.getElementById('prevBtn').onclick=()=>changePeriod(-1);document.getElementById('nextBtn').onclick=()=>changePeriod(1);document.getElementById('todayBtn').onclick=()=>{anchor=new Date();renderSchedule()};document.getElementById('saveProgress').onclick=saveProgress;document.getElementById('deleteProgress').onclick=deleteProgress;document.getElementById('addEvent').onclick=addEvent;document.getElementById('importIcsBtn').onclick=()=>document.getElementById('icsInput').click();document.getElementById('icsInput').addEventListener('change',e=>{importICSFiles([...e.target.files]);e.target.value=''});document.getElementById('clearImportedBtn').onclick=clearImported;document.getElementById('eventInput').addEventListener('keydown',e=>{if(e.key==='Enter')addEvent()});document.querySelectorAll('.modalback').forEach(x=>x.addEventListener('click',e=>{if(e.target===x){x.classList.remove('show');editing=null;eventDate=null}}));render();initAuth();
</script>
